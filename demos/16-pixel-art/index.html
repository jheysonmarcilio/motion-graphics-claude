<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Pixel Art 8-bit — teste</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:12px monospace;color:#fff}
  #stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
  canvas{display:block;image-rendering:pixelated}
  #scan{position:absolute;inset:0;pointer-events:none;display:none;
    background:linear-gradient(rgba(0,0,0,0) 62%,rgba(0,0,0,.3) 62%);background-size:100% calc(var(--s)*1px)}
  #scan.on{display:block}
  #hud{position:fixed;left:8px;bottom:6px;opacity:.55}
</style>
<div id="stage"><canvas id="c"></canvas><div id="scan"></div></div>
<div id="hud">ESPAÇO pausa · ←/→ ±1s · S scanlines CRT · ?t=5 · ?nohud</div>
<script>
const W = 384, H = 216, DUR = 12;
const HZ = 134, LAKE0 = 142, GR = 182;           // horizonte, início do lago, topo do chão
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const img = g.createImageData(W, H);

// ---------- utilidades ----------
const BY = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + .5) / 16);   // dither Bayer 4x4
const hx = s => [1,3,5].map(i => parseInt(s.slice(i, i + 2), 16));
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let T = 0, P = 0;                                                      // tempo, fase (0 = pôr do sol, 1 = noite)
const C = (d, n) => { const a = hx(d), b = hx(n); return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*P)).join(',')})`; };
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const PX = (x, y, c) => R(x, y, 1, 1, c);
function disc(cx, cy, r, c){ g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r; y <= r; y++){ const w = Math.floor(Math.sqrt(r*r - y*y) + .5); g.fillRect(cx - w, cy + y, w*2 + 1, 1); } }
function halo(cx, cy, r0, r1, c, s){ g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let y = -r1; y <= r1; y++) for (let x = -r1; x <= r1; x++){
    const d = Math.hypot(x, y); if (d < r0 || d > r1) continue;
    if ((1 - (d - r0) / (r1 - r0)) * s > BY[((cy+y)&3)*4 + ((cx+x)&3)]) g.fillRect(cx + x, cy + y, 1, 1); } }
function spr(rows, pal, x, y, s = 1){ x = Math.round(x); y = Math.round(y);
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++){ const c = pal[r[i]]; if (c){ g.fillStyle = c; g.fillRect(x + i*s, y + j*s, s, s); } } }); }

// fonte 3x5
const F = {
  A:'.#.|#.#|###|#.#|#.#', C:'###|#..|#..|#..|###', E:'###|#..|##.|#..|###', G:'###|#..|#.#|#.#|###',
  I:'###|.#.|.#.|.#.|###', L:'#..|#..|#..|#..|###', M:'#.#|###|###|#.#|#.#', N:'##.|#.#|#.#|#.#|#.#',
  O:'###|#.#|#.#|#.#|###', P:'###|#.#|###|#..|#..', R:'##.|#.#|##.|#.#|#.#', S:'###|#..|###|..#|###',
  T:'###|.#.|.#.|.#.|.#.', '&':'.#.|#.#|.#.|#.#|.##', '?':'###|..#|.##|...|.#.'
};
function glyph(gl, x, y, k, c){ gl.split('|').forEach((r, j) => { for (let i = 0; i < 3; i++) if (r[i] === '#') R(x + i*k, y + j*k, k, k, c); }); }

// ---------- dados com seed ----------
const rnd = mulberry32(8);
const STARS = Array.from({length: 110}, (_, k) => ({ x: Math.floor(rnd()*W), y: Math.floor(rnd()*118), th: .12 + rnd()*.65, ph: rnd()*6.28, big: k % 11 === 0 }));
const CLOUDS = Array.from({length: 7}, () => ({ x: rnd()*W, y: 16 + rnd()*70, w: 30 + Math.floor(rnd()*36), sp: 2 + rnd()*5 }));
const RIPPLES = Array.from({length: 70}, () => ({ x: rnd()*W, y: LAKE0 + 5 + rnd()*(GR - LAKE0 - 9), ph: rnd()*6.28 }));
const TUFTS = Array.from({length: 70}, () => ({ x: rnd()*(W + 50), ph: rnd()*6.28 }));
const SPECKS = Array.from({length: 160}, () => ({ x: rnd()*(W + 50), y: GR + 8 + rnd()*(H - GR - 8), l: rnd() < .5 }));
const FLIES = Array.from({length: 18}, () => ({ cx: rnd()*W, cy: 138 + rnd()*60, ax: 10 + rnd()*30, ay: 4 + rnd()*10, f: .4 + rnd()*.8, ph: rnd()*6.28 }));
const MIDPINES = Array.from({length: 34}, (_, k) => ({ wx: 470 + k*14 + rnd()*8, h: 12 + rnd()*12 }));
const BIRDS = [0,1,2,3];

// ---------- fundo: céu e lago em dither (vira de pôr do sol a noite) ----------
const SKY_D = ['#2b1b4a','#5b2a7a','#a23e8c','#e0556a','#ff8a4c','#ffd27a'].map(hx);
const SKY_N = ['#04061a','#0a1236','#13224f','#1d3470','#2a4a8a','#3d6aa8'].map(hx);
const LK_D  = ['#ffb35c','#e0556a','#a23e8c','#5b2a7a','#3a1d58'].map(hx);
const LK_N  = ['#3d6aa8','#24427a','#16295a','#0b1636','#060b20'].map(hx);
function bg(){
  const d = img.data;
  for (let y = 0; y < H; y++){
    const lake = y >= LAKE0, A = lake ? LK_D : SKY_D, B = lake ? LK_N : SKY_N;
    const t = lake ? Math.min((y - LAKE0) / (GR - LAKE0), 1) : Math.min(y / HZ, 1);
    const f = t * (A.length - 1), i = Math.min(Math.floor(f), A.length - 2), fr = f - i;
    for (let x = 0; x < W; x++){
      const th = BY[(y&3)*4 + (x&3)], th2 = BY[((y+2)&3)*4 + ((x+2)&3)];
      const pal = P > th2 ? B : A, c = fr > th ? pal[i+1] : pal[i], o = (y*W + x)*4;
      d[o] = c[0]; d[o+1] = c[1]; d[o+2] = c[2]; d[o+3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}

// ---------- cordilheiras e pinheiros ----------
const rh = (amp, sp, ph, wx) => { const u = wx*sp;
  const v = .5 + .5*(Math.sin(u+ph)*.55 + Math.sin(u*2.3+ph*1.7)*.3 + Math.sin(u*5.1+ph*.5)*.15);
  return Math.round(amp*v/2)*2; };
function ridge(base, amp, sc, sp, ph, top, body, hi){
  for (let x = 0; x < W; x++){
    const yt = base - rh(amp, sp, ph, x + sc);
    R(x, yt, 1, base - yt, body); R(x, yt, 1, 2, top);
    for (let k = 2; k < 8; k++) if ((1 - (k-2)/6)*.65 > BY[((yt+k)&3)*4 + (x&3)]) PX(x, yt + k, hi);
  }
}
function pine(x, by, h, c1, c2, sw, tiers){
  x = Math.round(x);
  const tr = Math.round(h*.12); R(x-1, by - tr, 3, tr, c2);
  const step = h*.8/tiers, th = Math.round(h*.3);
  for (let t = 0; t < tiers; t++){
    const y0 = Math.round(by - h + t*step), hw = h*.2*(.4 + .6*(t+1)/tiers);
    for (let i = 0; i < th; i++){
      const y = y0 + i, w = Math.max(1, Math.round(hw*(i+1)/th) - (i%3 === 2 ? 1 : 0));
      const dx = Math.round(Math.sin(T*1.3 + x*.1) * sw * (by - y) / h);
      R(x - w + dx, y, w, 1, c1); R(x + dx, y, w, 1, c2);
    }
  }
}

// ---------- sprites ----------
const HERO = [
  '...kkkkk....', '..khhhhhk...', '.khhhhhhhk..', '.khhhhsssk..', '.khhhssesk..', '.khhhssssk..',
  '..khhsssk...', '...kkrrrk...', '..kbbrrbbk..', '.kbbbbbbbbk.', '.kbbbbbbbbsk', '.kbbbbbbbbk.',
  '.kppppppppk.', '.kpppppppppk', '..kddddddddk'
];
const ICONS = [
  { pal:{r:'#ef4a5a',w:'#fff1e8'}, rows:['.rrr.rrr.','rrwrrrrrr','rrrrrrrrr','rrrrrrrrr','.rrrrrrr.','..rrrrr..','...rrr...','....r....'] },
  { pal:{y:'#ffec27',o:'#ef7d57',g:'#7a8aa0',w:'#fff1e8'}, rows:['..ooooo..','.oyyyyyo.','oyyyyyyyo','oyywyyyyo','oyyyyyyyo','.oyyyyyo.','..oyyyo..','..ggggg..','..ggggg..','...ggg...'] },
  { pal:{y:'#ffec27',o:'#ffa300'}, rows:['....y....','....y....','...yyy...','yyyyyyyyy','.yyyyyyy.','..yyyyy..','..yyyyy..','.yyy.yyy.','.yy...yy.'] }
];

// ---------- fogo ----------
const fl = i => Math.sin(T*17 + i*2.3)*.5 + Math.sin(T*29 + i*5.1)*.5;
function fire(fx, fy){
  R(fx-12, fy-3, 24, 3, '#5d3a1a'); R(fx-10, fy-5, 20, 2, '#7a4a24');
  for (let dx = -4; dx <= 4; dx++){
    const base = (1 - Math.abs(dx)/5.2) * 24 * (.75 + .25*fl(dx));
    R(fx + dx*2 - 1, fy - 4 - Math.round(base),      2, Math.round(base),      '#b13e53');
    R(fx + dx*2 - 1, fy - 4 - Math.round(base*.8),   2, Math.round(base*.8),   '#ef7d57');
    if (Math.abs(dx) < 4) R(fx + dx*2 - 1, fy - 4 - Math.round(base*.55), 2, Math.round(base*.55), '#ffcd75');
    if (Math.abs(dx) < 2) R(fx + dx*2 - 1, fy - 4 - Math.round(base*.3),  2, Math.round(base*.3),  '#fff1e8');
  }
  R(fx-13, fy-2, 26, 3, '#7a4a24'); R(fx-13, fy-2, 2, 3, '#ffcd75'); R(fx+11, fy-2, 2, 3, '#ffcd75');
  for (let i = -2; i <= 2; i++) R(fx + i*6 - 2, fy + 2, 5, 3, i % 2 ? '#566c86' : '#94a3b8');
  for (let k = 0; k < 14; k++){
    const ph = (T*.8 + k*.19) % 1, x = fx + Math.round(Math.sin(k*5.3 + ph*6) * (4 + ph*9)), y = fy - 18 - ph*54;
    R(x, y, k%3 ? 1 : 2, k%3 ? 1 : 2, ph < .4 ? '#ffcd75' : ph < .7 ? '#ef7d57' : '#b13e53');
  }
}

// ---------- cena ----------
function renderAt(t){
  T = t; P = ease(t / DUR);
  const cam = (t / DUR - .5) * 24;
  bg();

  // estrelas
  for (const s of STARS) if (P > s.th){
    if (s.big && P > s.th + .1){ R(s.x-1, s.y, 3, 1, '#6a7fcf'); R(s.x, s.y-1, 1, 3, '#6a7fcf'); }
    PX(s.x, s.y, Math.sin(T*3 + s.ph) > .6 ? '#ffffff' : '#9fb4ff');
  }
  // sol
  if (P < .97){ const sx = 262, sy = 104 + P*58;
    g.save(); g.beginPath(); g.rect(0, 0, W, LAKE0); g.clip();
    halo(sx, sy, 15, 44, '#ffb35c', .7*(1 - P)); disc(sx, sy, 15, '#ffcd75'); disc(sx, sy, 11, '#fff1c0'); g.restore(); }
  // lua
  if (P > .05){ const mx = 105, my = 122 - P*76;
    halo(mx, my, 13, 38, '#aac8ff', .55*P); disc(mx, my, 13, '#dbe6ff');
    disc(mx-4, my-3, 3, '#b4c2e6'); disc(mx+5, my+4, 2, '#b4c2e6'); disc(mx+2, my-7, 2, '#b4c2e6'); disc(mx-6, my+6, 1, '#b4c2e6'); disc(mx+7, my-3, 1, '#b4c2e6'); }
  // nuvens
  for (const c of CLOUDS){
    const x = ((c.x + T*c.sp) % (W + 90)) - 45, w = c.w, y = Math.round(c.y), lt = C('#ffb09a','#34457a'), sh = C('#c8587a','#1f2d5a');
    R(x+4, y+1, Math.round(w*.6), 4, lt); R(x + w*.3, y-2, Math.round(w*.35), 4, lt); R(x, y+4, w, 4, lt); R(x, y+7, w, 2, sh); R(x+3, y+9, w-8, 1, sh);
  }
  // pássaros (só no entardecer)
  for (const k of BIRDS) if (P < .5 + k*.05){
    const x = Math.round(((T*20 + k*70) % (W + 40)) - 20), y = Math.round(52 + k*10 + Math.sin(T*2 + k)*3), c = C('#2a1648','#2a1648');
    if ((Math.floor(T*6 + k) & 1) === 0){ PX(x-2,y-1,c); PX(x-1,y,c); PX(x,y+1,c); PX(x+1,y,c); PX(x+2,y-1,c); }
    else { PX(x-2,y+1,c); PX(x-1,y,c); PX(x,y,c); PX(x+1,y,c); PX(x+2,y+1,c); }
  }
  // montanhas
  ridge(LAKE0, 52, 100 + cam*.15, .018, 0,   C('#d46a8a','#33468a'), C('#6b3a7d','#16204a'), C('#8f4a8a','#1f2e66'));
  ridge(LAKE0, 38, 300 + cam*.25, .027, 2,   C('#a24a7a','#243a7a'), C('#4a2a6a','#101a3c'), C('#6a3a7a','#162450'));
  const sc = 500 + cam*.4;
  ridge(LAKE0, 20, sc, .04, 4, C('#5a3070','#16245a'), C('#3d2060','#0c1434'), C('#4c2a6a','#101c46'));
  for (const p of MIDPINES){ const sx = p.wx - sc; if (sx < -12 || sx > W + 12 || Math.abs(p.wx - 790) < 14) continue;
    pine(sx, LAKE0 - rh(20, .04, 4, p.wx) + 4, p.h, C('#341a58','#0b1536'), C('#2a1648','#070e26'), .6, 3); }
  // cabana com janela acesa e fumaça
  { const cwx = 790, cx = Math.round(cwx - sc), y = LAKE0 - rh(20, .04, 4, cwx) + 3, dark = C('#2a1640','#080e24');
    R(cx+2, y-19, 3, 6, dark); R(cx, y-9, 14, 9, dark);
    for (let i = 0; i < 6; i++){ const w = 4 + i*3; R(cx + 7 - Math.round(w/2), y-15+i, w, 1, C('#1c0e30','#050a1a')); }
    const wc = P > .15 ? (fl(3) > -.6 ? '#ffcd75' : '#ef7d57') : C('#e0a060','#e0a060');
    R(cx+8, y-7, 3, 3, wc); R(cx+3, y-5, 3, 5, C('#1a0c2a','#040818'));
    if (P > .2) halo(cx+9, y-6, 2, 11, '#ffb040', .6*P);
    for (let k = 0; k < 6; k++){ const ph = (T*.4 + k/6) % 1;
      R(cx + 4 + Math.sin(ph*6 + k)*3 + ph*10, y - 21 - ph*24, 2, 2, mix2(ph)); } }
  // lago: reflexo escuro da margem
  { const dk = C('#2a1648','#050a1c');
    for (let yy = 0; yy < 10; yy++) for (let x = 0; x < W; x++) if ((1 - yy/10)*.85 > BY[((LAKE0+yy)&3)*4 + (x&3)]) PX(x, LAKE0 + yy, dk); }
  // reflexo do sol / lua
  g.globalAlpha = .85*(1 - P);
  for (let yy = LAKE0 + 3; yy < GR - 3; yy += 3){ const w = Math.round((16 + (yy-LAKE0)*.2) * (.5 + .5*Math.sin(T*2.1 + yy*.9))); R(262 + Math.round(Math.sin(T*1.4 + yy*.5)*3) - w/2, yy, w, 1, '#ffcd75'); }
  g.globalAlpha = .85*clamp((P - .3)/.5);
  for (let yy = LAKE0 + 3; yy < GR - 3; yy += 3){ const w = Math.round((14 + (yy-LAKE0)*.15) * (.5 + .5*Math.sin(T*2.1 + yy*.9))); R(105 + Math.round(Math.sin(T*1.4 + yy*.5)*2) - w/2, yy, w, 1, '#dbe6ff'); }
  g.globalAlpha = 1;
  // ondulações
  { const rc = C('#ffd27a','#8fb4ff');
    for (const r of RIPPLES){ if (Math.sin(T*1.8 + r.ph) < .3) continue; const w = 3 + Math.round((r.y - LAKE0)/4);
      R(r.x - cam*.4 + Math.sin(T*.7 + r.ph)*2 - w/2, r.y, w, 1, rc); } }

  // chão
  { const col = C('#2c2a4a','#0b1e22'), hi = C('#5a4a6a','#1c4a3a'), mid = C('#3c3458','#10302a');
    const gt = wx => GR + Math.round(2*Math.sin(wx*.04 + 1) + 1.5*Math.sin(wx*.11));
    for (let x = 0; x < W; x++){ const y = gt(x + cam);
      R(x, y, 1, H - y, col); R(x, y, 1, 2, hi);
      for (let k = 2; k < 7; k++) if ((1 - (k-2)/5)*.7 > BY[((y+k)&3)*4 + (x&3)]) PX(x, y + k, mid); }
    for (const s of SPECKS) PX(s.x - cam, s.y, s.l ? hi : C('#1c1a34','#06120f'));
    for (const tf of TUFTS){ const x = Math.round(tf.x - cam), y = gt(tf.x), sw = Math.round(Math.sin(T*2 + tf.ph)*.8);
      R(x, y-2, 1, 2, hi); PX(x + sw, y-3, C('#8a7a8a','#3a8a5a')); R(x+2, y-1, 1, 1, hi); } }

  // luz da fogueira sobre tudo
  const fx = Math.round(205 - cam), fy = 198;
  halo(fx, fy - 8, 6, 62, '#ff8a2a', (.38 + .12*fl(0)) * (.35 + .65*P));

  // personagem
  { const cx = Math.round(165 - cam), yb = 196;
    R(cx - 1, yb + 1, 16, 2, 'rgba(0,0,0,.35)');
    const blink = (T % 3.4) < .14;
    spr(HERO, { k:'#1a1c2c', h:'#8a4a2a', s:'#f4b48a', b:'#3b5dc9', r:'#b13e53', p:'#566c86', d:'#29366f', e: blink ? '#f4b48a' : '#1a1c2c' }, cx, yb - 15);
    // balão de pensamento
    const pop = ease((T - .6)/.6), bx = cx + 20, by = 150 + Math.round(Math.sin(T*2)*1.5), rx = Math.round(18*pop), ry = Math.round(15*pop);
    if (pop > 0){
      for (const [e, c] of [[1,'#1a1c2c'],[0,'#fff1e8']]) for (let y = -ry - e; y <= ry + e; y++){
        const w = Math.round((rx + e) * Math.sqrt(Math.max(0, 1 - (y*y)/((ry + e)*(ry + e))))); R(bx - w, by + y, w*2 + 1, 1, c); }
      disc(cx + 12, by + 20, 3, '#1a1c2c'); disc(cx + 12, by + 20, 2, '#fff1e8');
      disc(cx + 8,  by + 28, 2, '#1a1c2c'); disc(cx + 8,  by + 28, 1, '#fff1e8');
      const u = (T - 1.2) % 2.2, idx = Math.floor((T - 1.2)/2.2);
      if (pop >= 1 && T > 1.2 && u > .12){
        const n = idx % 4;
        if (n === 0) glyph(F['?'], bx - 4, by - 7, 3, '#5d275d');
        else { const ic = ICONS[n-1], rw = ic.rows[0].length, bob = Math.round(Math.sin(T*6)*1);
          spr(ic.rows, ic.pal, bx - rw, by - ic.rows.length + bob, 2); }
      }
    }
    fire(fx, fy);
  }

  // pinheiros de primeiro plano
  const c1 = C('#2a3a4a','#0a2a22'), c2 = C('#1a2238','#061a16');
  pine(34 - cam, GR + 24, 130, c1, c2, 2.2, 5);
  pine(352 - cam, GR + 26, 112, c1, c2, 2.2, 5);
  pine(318 - cam, GR + 30, 68, c1, c2, 1.6, 4);

  // vaga-lumes
  if (P > .25) for (const f of FLIES){ const x = Math.round(f.cx + Math.sin(T*f.f + f.ph)*f.ax - cam), y = Math.round(f.cy + Math.cos(T*f.f*.8 + f.ph*2)*f.ay), b = Math.sin(T*2.2 + f.ph*3);
    if (b > .45){ PX(x, y, '#d4ff5a'); if (b > .8){ R(x-1, y, 3, 1, '#6b8a2a'); R(x, y-1, 1, 3, '#6b8a2a'); PX(x, y, '#f4ffb0'); } } }

  // título
  { const S = 'MENTE & PSICOLOGIA', n = Math.floor(clamp((T - .5)/2.2) * S.length), x0 = Math.round((W - (S.length*12 - 3))/2), y0 = 10;
    const cols = ['#ffec27','#ffa300','#ff77a8','#29adff'], sh = Math.floor(T*5);
    const yo = i => T > 3 ? Math.round(Math.sin(T*3.5 + i*.6)*1.5) : 0;
    for (let i = 0; i < n; i++) if (F[S[i]]) glyph(F[S[i]], x0 + i*12 + 3, y0 + 3 + yo(i), 3, '#2a1648');
    for (let i = 0; i < n; i++) if (F[S[i]]) glyph(F[S[i]], x0 + i*12, y0 + yo(i), 3, cols[(i + sh) % 4]);
    if (n < S.length && Math.floor(T*8) % 2 === 0) R(x0 + n*12, y0, 9, 15, '#fff1e8');
    if (T > 3.2 && Math.floor(T*1.6) % 2 === 0) { const s2 = 'PRESS START'; let x = Math.round((W - (s2.length*4 - 1))/2);
      for (const ch of s2){ if (F[ch]) { glyph(F[ch], x + 1, 205, 1, '#000'); glyph(F[ch], x, 204, 1, '#ffec27'); } x += 4; } } }

  // fade de entrada
  if (t < .6){ g.globalAlpha = 1 - t/.6; R(0, 0, W, H, '#000'); g.globalAlpha = 1; }
}
function mix2(ph){ const a = Math.round(150 - ph*80), b = Math.round(160 - ph*80), c = Math.round(180 - ph*90); return `rgb(${a},${b},${c})`; }

// ---------- exposição + player ----------
window.__mg = { duration: DUR, fps: 30, width: W, height: H, renderAt, loaded: false };
const scan = document.getElementById('scan'), stage = document.getElementById('stage');
function fit(){ let s = Math.min(innerWidth / W, innerHeight / H); s = s >= 1 ? Math.floor(s) : s;
  cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px'; scan.style.setProperty('--s', s); }
addEventListener('resize', fit); fit();
if (Q.has('nohud') || Q.has('export')) document.getElementById('hud').style.display = 'none';
let tt = Q.has('t') ? +Q.get('t') : 0, paused = Q.has('t'), last = null;
if (Q.has('export')) { renderAt(tt); __mg.loaded = true; }
else {
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    if (e.code === 'ArrowRight') tt = (tt + 1) % DUR;
    if (e.code === 'ArrowLeft') tt = (tt - 1 + DUR) % DUR;
    if (e.code === 'KeyS') scan.classList.toggle('on');
  });
  (function loop(now){ if (last != null && !paused) tt = (tt + (now - last)/1000) % DUR; last = now; renderAt(tt); requestAnimationFrame(loop); })(performance.now());
}
