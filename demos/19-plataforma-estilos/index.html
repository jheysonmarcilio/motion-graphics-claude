<body>
<h1>Plataforma lateral cooperativa (até 4 jogadores) — 10 estilos visuais</h1>
<p class="sub">Telas estáticas. Em todas: 4 heróis (vermelho, azul, verde, roxo), chão com buraco/água, plataformas, plataforma móvel, espinhos, inimigo, caixote, estrelas e bandeira de chegada.</p>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720;
const COL = [0xff4d5e, 0x3b9cff, 0x3ddc84, 0xb06bff], HEX = COL.map(c => '#' + c.toString(16).padStart(6, '0'));
// cena padrão (unidades do mundo; tela vai de x=-16..16 e y=-3..15). Chão no y=0, buraco entre x=6 e x=10.
const HER = [[-13, 0], [-3.5, 3.5], [8, 5], [3, 6.2]];           // x, y dos pés (o 3º está no meio de um pulo sobre o buraco)
const COINS = [[-11.4, 1.4], [-10.3, 2.2], [-9.2, 1.4], [-5, 6.9], [-3.8, 7.3], [-2.6, 6.9], [5.6, 6.6], [7, 8], [8.4, 8], [9.6, 6.6], [12.1, 3.4], [1.4, 9.6], [4.6, 9.6]];
const SPIKES = [11.2, 12.0, 12.8], ENEMY = -6.6, CRATE = 14.1, FLAG = 15.4;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const rnd = (() => { let a = 11; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; })();

// ---------- utilidades 3D ----------
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .8, ...o });
const mk = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const Bx = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const sun = (scene, p = [-12, 26, 24], i = 2.2, c = 0xffffff) => { const l = new THREE.DirectionalLight(c, i); l.position.set(...p); l.castShadow = true; l.shadow.mapSize.set(4096, 4096); const k = l.shadow.camera; k.left = -40; k.right = 40; k.top = 30; k.bottom = -30; k.near = 1; k.far = 120; l.shadow.bias = -.0004; l.shadow.normalBias = .04; scene.add(l); return l; };
const shadows = o => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
const cam3 = () => { const c = new THREE.PerspectiveCamera(30, W / H, .5, 400); c.position.set(0, 6, 36); c.lookAt(0, 6, 0); return c; };
const gradBg = (a, b) => { const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1a1020, side: THREE.BackSide });
outlineMat.onBeforeCompile = s => { s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.07;'); };
const addOutline = root => { const l = []; root.traverse(m => { if (m.isMesh && !m.userData.noOutline) l.push(m); }); l.forEach(m => { const o = new THREE.Mesh(m.geometry, outlineMat); o.userData.noOutline = true; m.add(o); }); };
const starGeo = (d = .2) => { const s = new THREE.Shape(); for (let i = 0; i < 10; i++) { const r = i % 2 ? .3 : .62, a = i / 10 * 6.283 + 1.5708; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); } const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 2 }); g.translate(0, 0, -d / 2); return g; };

// bichinho: cada jogador com silhueta diferente (chifres, orelhas, antena, crista). Olha para +z; o wrapper vira para +x.
function critter(color, i, o = {}) {
	const M = o.mat || (c => std(c, { flatShading: true })), g = new THREE.Group();
	const bg = o.geo === 'ico' ? new THREE.IcosahedronGeometry(.72, 1) : o.geo === 'cap' ? new THREE.CapsuleGeometry(.55, .45, 6, 14) : new THREE.SphereGeometry(.72, 28, 18);
	const b = mk(bg, M(color), 0, .85, 0); b.scale.set(1, .92, .95); g.add(b);
	const w = M(0xffffff), k = M(0x1a1226), dark = M(new THREE.Color(color).multiplyScalar(.6).getHex());
	for (const s of [-1, 1]) {
		g.add(mk(new THREE.SphereGeometry(.2, 16, 12), w, s * .27, 1.05, .55), mk(new THREE.SphereGeometry(.1, 12, 10), k, s * .27 + .02, 1.05, .71));
		const f = mk(new THREE.SphereGeometry(.22, 14, 10), dark, s * .32, .14, .12); f.scale.set(1, .6, 1.3); g.add(f);
		if (o.angry) { const br = mk(Bx(.34, .07, .08), k, s * .27, 1.32, .62); br.rotation.z = s * .5; g.add(br); }
	}
	const ex = i % 4, cream = M(0xfff1c9);
	if (ex === 0) for (const s of [-1, 1]) { const h = mk(new THREE.ConeGeometry(.16, .5, 8), cream, s * .38, 1.6, 0); h.rotation.z = -s * .45; g.add(h); }
	if (ex === 1) for (const s of [-1, 1]) g.add(mk(new THREE.SphereGeometry(.24, 14, 10), M(color), s * .5, 1.5, 0));
	if (ex === 2) g.add(mk(new THREE.CylinderGeometry(.04, .04, .45), cream, 0, 1.78, 0), mk(new THREE.SphereGeometry(.14, 12, 10), M(0xffd23f), 0, 2.05, 0));
	if (ex === 3) for (let n = -1; n <= 1; n++) { const h = mk(new THREE.ConeGeometry(.14, .42, 6), cream, 0, 1.65 - Math.abs(n) * .08, n * .3); h.rotation.x = n * .5; g.add(h); }
	return g;
}
const side = (g, dir = 1) => { g.scale.setScalar(1.15); g.rotation.y = 1.25 * dir; const w = new THREE.Group(); w.add(g); shadows(w); return w; };

// monta a cena padrão com as peças do estilo S
function world3d(scene, S) {
	S.decor(scene);
	scene.add(S.ground(-19, 6), S.ground(10, 19), S.pit(6, 10), S.plat(-5.5, -1.5, 3.5, 0), S.plat(1, 5, 6.2, 1), S.mov(6.2, 9.8, 2.6));
	HER.forEach(([x, y], i) => { const h = S.hero(COL[i], i); h.position.set(x, y, .6 - i % 2 * .5); scene.add(h); });
	COINS.forEach(([x, y], i) => { const c = S.coin(); c.position.set(x, y, 0); c.rotation.y = .5; scene.add(c); });
	SPIKES.forEach(x => { const s = S.spike(); s.position.set(x, 0, .3); scene.add(s); });
	const e = S.enemy(); e.position.set(ENEMY, 0, .4); scene.add(e);
	const cr = S.crate(); cr.position.set(CRATE, 0, .2); scene.add(cr);
	const fl = S.flag(); fl.position.set(FLAG, 0, -.3); scene.add(fl);
}
const clouds3 = (scene, mat, n = 6, z = -34, mk2) => { for (let i = 0; i < n; i++) { const c = new THREE.Group(); for (let j = 0; j < 4; j++) { const p = mk(new THREE.IcosahedronGeometry(1.8 + rnd() * 1.2, mk2 ?? 1), mat, j * 2.1, rnd(), rnd() * 1.5); p.scale.y = .75; c.add(p); } c.position.set(-34 + i * 13 + rnd() * 4, 11 + rnd() * 6, z - rnd() * 8); scene.add(c); } };

// ================= 1 + 10 · LOW-POLY (e 3D pixelado) =================
function lowworld(o) {
	const scene = new THREE.Scene(); scene.background = gradBg(o.sky[0], o.sky[1]); scene.fog = new THREE.Fog(o.sky[1], 70, 170);
	scene.add(new THREE.HemisphereLight(0xffffff, o.low, 1.15)); sun(scene);
	const M = c => o.pixel ? new THREE.MeshLambertMaterial({ color: c, flatShading: true }) : std(c, { flatShading: true });
	const S = {
		decor(sc) {
			o.hills.forEach((c, i) => { for (let k = 0; k < 8; k++) { const h = 9 + rnd() * 8 + i * 2; sc.add(mk(new THREE.ConeGeometry(8 + rnd() * 6, h, o.pixel ? 4 : 6), M(c), -50 + k * 14 + rnd() * 6, h / 2 - 4, -22 - i * 12)); } });
			for (let k = 0; k < 11; k++) {
				const x = -18 + k * 3.6 + rnd() * 1.5; if (x > 4.5 && x < 11.5) continue; const z = -3 - rnd() * 4, g = new THREE.Group();
				if (o.cactus) { g.add(mk(Bx(.8, 3.4, .8), M(o.tree[0]), 0, 1.7, 0), mk(Bx(.5, .5, 1.3), M(o.tree[0]), .6, 1.9, 0), mk(Bx(.5, 1.3, .5), M(o.tree[0]), 1, 2.4, 0)); }
				else { g.add(mk(new THREE.CylinderGeometry(.22, .3, 1.2, 6), M(0x7a4f2a), 0, .6, 0), mk(new THREE.ConeGeometry(1.5, 2.6, 6), M(o.tree[0]), 0, 2.2, 0), mk(new THREE.ConeGeometry(1.1, 2.2, 6), M(o.tree[1]), 0, 3.5, 0)); }
				g.position.set(x, 0, z); g.scale.setScalar(.9 + rnd() * .5); shadows(g); sc.add(g);
			}
			clouds3(sc, M(0xffffff), 6, -34, 0);
			for (const s of [-1, 1]) { const b = mk(new THREE.IcosahedronGeometry(3.2, 0), M(o.bush), s * 16, -1.5, 14); b.scale.set(1.4, 1, 1); sc.add(b); }
		},
		ground(x0, x1) { const w = x1 - x0, g = new THREE.Group(); g.add(mk(Bx(w, 4, 12), M(o.dirt), 0, -2.6, 0), mk(Bx(w, .6, 12), M(o.grass), 0, -.3, 0)); for (let k = 0; k < w / 3; k++) g.add(mk(new THREE.DodecahedronGeometry(.4, 0), M(o.rock), -w / 2 + k * 3 + rnd(), -1.4 - rnd() * 1.4, 6.05)); g.position.set((x0 + x1) / 2, 0, -2); shadows(g); return g; },
		plat(x0, x1, y) { const w = x1 - x0, g = new THREE.Group(); g.add(mk(Bx(w, .5, 4.4), M(o.grass), 0, -.25, 0), mk(Bx(w - .2, .7, 4.2), M(o.dirt), 0, -.85, 0), mk(new THREE.ConeGeometry(w / 2.4, 2.4, 6), M(o.dirt), 0, -2.4, 0)); g.children[2].rotation.x = Math.PI; g.position.set((x0 + x1) / 2, y, 0); shadows(g); return g; },
		mov(x0, x1, y) { const w = x1 - x0, g = new THREE.Group(); g.add(mk(Bx(w, .7, 3.6), M(0xb8864b), 0, -.35, 0)); for (const s of [-1, 1]) { const a = mk(new THREE.ConeGeometry(.35, .7, 3), M(0xffd23f), s * 1.2, -.35, 1.85); a.rotation.z = -s * Math.PI / 2; g.add(a); } g.position.set((x0 + x1) / 2, y, 0); shadows(g); return g; },
		pit(x0, x1) { const m = mk(Bx(x1 - x0, 1.2, 8), std(o.water, { roughness: .2, transparent: true, opacity: .9 }), (x0 + x1) / 2, -1.5, 0); return m; },
		hero: (c, i) => side(critter(c, i, { geo: 'ico', mat: M })),
		coin() { const g = new THREE.Group(); g.add(mk(starGeo(), M(0xffd23f))); shadows(g); return g; },
		spike() { const m = mk(new THREE.ConeGeometry(.42, 1.2, 4), M(0xaab4c0), 0, .6, 0); m.rotation.y = .78; shadows(m); return m; },
		enemy() { const g = side(critter(0x7b3fa0, 0, { geo: 'ico', mat: M, angry: true }), -1); return g; },
		crate() { const g = new THREE.Group(); g.add(mk(Bx(1.7, 1.7, 1.7), M(0xb5763a), 0, .85, 0), mk(Bx(1.8, .2, 1.8), M(0x7a4a20), 0, 1.7, 0)); shadows(g); return g; },
		flag() { const g = new THREE.Group(); g.add(mk(new THREE.CylinderGeometry(.08, .08, 6, 6), M(0xffffff), 0, 3, 0)); const f = mk(new THREE.ConeGeometry(.9, 1.8, 3), M(0xff4d5e), .9, 5.2, 0); f.rotation.z = -Math.PI / 2; g.add(f, mk(new THREE.IcosahedronGeometry(.2, 0), M(0xffd23f), 0, 6.1, 0)); shadows(g); return g; },
	};
	world3d(scene, S);
	const camera = cam3();
	if (o.pixel) { const comp = new EffectComposer(renderer); comp.addPass(new RenderPixelatedPass(4, scene, camera)); return { scene, camera, comp }; }
	return { scene, camera };
}
const lowpoly = () => lowworld({ sky: ['#4cc2ff', '#d8f3ff'], low: 0x6a8f4a, hills: [0x7db7a0, 0x5fa88a, 0x3f9275], tree: [0x2e9e4f, 0x48bb68], grass: 0x7ed957, dirt: 0xa86f45, rock: 0x8a5a38, water: 0x2fb4e8, bush: 0x2b7a3c });
const pixel3d = () => lowworld({ pixel: true, cactus: true, sky: ['#ff9a5a', '#ffe2a8'], low: 0xd9a35a, hills: [0xe3a06a, 0xc9804f, 0xa8603b], tree: [0x3f9a4a, 0], grass: 0xf0cf7a, dirt: 0xc2813c, rock: 0x8d5a2e, water: 0x1c8fe0, bush: 0x6a8f3a });

// ================= 2 · VOXEL =================
function voxel() {
	const scene = new THREE.Scene(); scene.background = gradBg('#4aa8ff', '#cfeaff'); scene.fog = new THREE.Fog(0xcfeaff, 70, 160);
	scene.add(new THREE.HemisphereLight(0xffffff, 0x7a8a6a, 1.25)); sun(scene);
	const V = [], cube = (x, y, z, c) => V.push([x, y, z, c]), L = c => new THREE.MeshLambertMaterial({ color: c });
	const col = (c, v = .05) => new THREE.Color(c).offsetHSL(0, 0, (rnd() - .5) * v);
	const S = {
		decor(sc) {
			[[0x8fc8e8, -14, 12], [0x7cc29a, -9, 9], [0x5cae6a, -6, 7]].forEach(([c, z, amp], li) => { for (let x = -40; x < 40; x++) { const h = Math.floor(amp * .5 + amp * .5 * Math.sin(x * .17 + li * 2) + 1.5 * Math.sin(x * .5)); for (let y = -4; y < h - 2; y++) cube(x, y + .5, z - li * .0, y === h - 3 ? col(c, .04) : col(new THREE.Color(c).multiplyScalar(.85).getHex(), .04)); } });
			for (let k = 0; k < 8; k++) { const x = Math.round(-17 + k * 4.4 + rnd() * 2) + .5; if (x > 4 && x < 12) continue; const z = -3 - Math.floor(rnd() * 3); for (let y = 0; y < 3; y++) cube(x, y + .5, z, 0x7a4f2a); for (const [dx, dy, dz, w] of [[0, 3, 0, 1], [-1, 3, 0, 1], [1, 3, 0, 1], [0, 4, 0, 1], [-1, 4, 0, 1], [1, 4, 0, 1], [0, 5, 0, 1]]) cube(x + dx, dy + .5, z + dz, col(0x2e9e45, .06)); }
			for (let i = 0; i < 6; i++) { const x = -34 + i * 13 + rnd() * 4, y = 12 + rnd() * 5, z = -30; for (let j = 0; j < 5; j++) for (let k = 0; k < 2; k++) cube(x + j * 2, y + k * 1.5, z, 0xffffff); }
		},
		ground(x0, x1) { const g = new THREE.Group(); for (let x = Math.ceil(x0) + .5; x < x1; x++) for (let y = 0; y < 5; y++) for (let z = -1; z <= 3; z++) cube(x, -y - .5, z, y === 0 ? col(0x4fc447, .08) : col(y < 2 ? 0x9a6234 : 0x7a7f88, .06)); return g; },
		plat(x0, x1, y, k) { const g = new THREE.Group(); for (let x = x0 + .5; x < x1; x++) for (let z = 0; z <= 1; z++) { cube(x, y - .5, z, col(0x4fc447, .08)); cube(x, y - 1.5, z, col(0x9a6234, .06)); } return g; },
		mov(x0, x1, y) { const g = new THREE.Group(); for (let x = x0 + .4; x < x1; x++) for (let z = 0; z <= 1; z++) cube(x, y - .5, z, (Math.floor(x) + z) % 2 ? 0xc9a063 : 0xb8864b); return g; },
		pit(x0, x1) { return mk(Bx(x1 - x0, 1.4, 6), new THREE.MeshLambertMaterial({ color: 0x2f7be0 }), (x0 + x1) / 2, -1.4, 1); },
		hero(c, i) { const dk = new THREE.Color(c).multiplyScalar(.75).getHex(), g = new THREE.Group(), b = (w, h, d, cc, x, y, z) => g.add(mk(Bx(w, h, d), L(cc), x, y, z)); b(.9, .9, .9, c, 0, 1.75, 0); b(.9, 1, .5, dk, 0, .85, 0); b(.3, .7, .3, 0x333344, -.25, .35, 0); b(.3, .7, .3, 0x333344, .25, .35, 0); b(.25, .8, .3, c, -.6, .9, 0); b(.25, .8, .3, c, .6, .9, 0); b(.22, .22, .08, 0xffffff, -.22, 1.85, .46); b(.22, .22, .08, 0xffffff, .22, 1.85, .46); b(.1, .12, .09, 0x111111, -.18, 1.85, .5); b(.1, .12, .09, 0x111111, .26, 1.85, .5); if (i % 2) b(1, .25, 1, 0xffd23f, 0, 2.3, 0); else { b(.2, .45, .2, 0xfff1c9, -.3, 2.4, 0); b(.2, .45, .2, 0xfff1c9, .3, 2.4, 0); } g.scale.setScalar(1.15); g.rotation.y = 1.0; const w = new THREE.Group(); w.add(g); shadows(w); return w; },
		coin() { const g = new THREE.Group(); const m = mk(Bx(.75, .75, .25), new THREE.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x705000 })); m.rotation.z = .78; g.add(m); shadows(g); return g; },
		spike() { const g = new THREE.Group(), m = L(0xaab4c0); g.add(mk(Bx(.8, .5, .8), m, 0, .25, 0), mk(Bx(.5, .5, .5), m, 0, .75, 0), mk(Bx(.25, .4, .25), m, 0, 1.2, 0)); shadows(g); return g; },
		enemy() { const g = new THREE.Group(), j = new THREE.MeshLambertMaterial({ color: 0x7b3fa0 }); g.add(mk(Bx(1.7, 1.3, 1.4), j, 0, .65, 0), mk(Bx(.4, .4, .1), L(0xffffff), -.5, .9, .72), mk(Bx(.4, .4, .1), L(0xffffff), .3, .9, .72), mk(Bx(.15, .2, .1), L(0x111111), -.55, .9, .78), mk(Bx(.15, .2, .1), L(0x111111), .25, .9, .78), mk(Bx(.5, .1, .1), L(0x111111), -.5, 1.2, .78), mk(Bx(.5, .1, .1), L(0x111111), .3, 1.2, .78)); shadows(g); return g; },
		crate() { const g = new THREE.Group(); g.add(mk(Bx(1.7, 1.7, 1.7), L(0xb5763a), 0, .85, 0), mk(Bx(1.8, .25, 1.8), L(0x7a4a20), 0, 1.7, 0), mk(Bx(1.8, .25, 1.8), L(0x7a4a20), 0, .05, 0)); shadows(g); return g; },
		flag() { const g = new THREE.Group(); for (let y = 0; y < 6; y++) g.add(mk(Bx(.25, 1, .25), L(0xffffff), 0, y + .5, 0)); for (let x = 0; x < 3; x++) for (let y = 0; y < 2; y++) g.add(mk(Bx(.7, .7, .2), L((x + y) % 2 ? 0xff4d5e : 0xffffff), .6 + x * .7, 5.1 - y * .7, 0)); shadows(g); return g; },
	};
	world3d(scene, S);

}

// ================= 3 · DESENHO ANIMADO (toon) =================
function toon() {
	const scene = new THREE.Scene(); scene.background = gradBg('#6fd3ff', '#ffe9a8'); scene.add(new THREE.HemisphereLight(0xffffff, 0xffd6f0, 1.6)); sun(scene, [-10, 24, 24], 1.5);
	const gm = new THREE.DataTexture(new Uint8Array([100, 180, 255]), 3, 1, THREE.RedFormat); gm.minFilter = gm.magFilter = THREE.NearestFilter; gm.needsUpdate = true;
	const T = c => new THREE.MeshToonMaterial({ color: c, gradientMap: gm }), RB = (w, h, d, r = .3) => new RoundedBoxGeometry(w, h, d, 3, r);

	SPIKES.forEach(x => felt(trif(X(x) - 18, Y(1.25), 36, 50), '#e0405a', '#ffe0e0'));

		const ex = i % 4; if (ex === 0 || angry) [-1, 1].forEach(q => felt(trif(px + q * 22 - 11, py - 108, 22, 30), '#fff1c9', '#e0c890')); else if (ex === 1) [-1, 1].forEach(q => felt(circ(px + q * 30, py - 80, 14), col)); else if (ex === 2) { felt(rect(px - 3, py - 112, 6, 30, 3), '#fff1c9'); felt(circ(px, py - 116, 10), '#ffd23f'); } else for (let n = -1; n <= 1; n++) felt(trif(px + n * 14 - 7, py - 104, 14, 26), '#fff1c9', '#e0c890');

	felt(rect(X(CRATE) - 34, Y(0) - 68, 68, 68, 8), '#e8a050'); g.strokeStyle = '#fff8e0'; g.lineWidth = 3; g.setLineDash([9, 7]); g.beginPath(); g.moveTo(X(CRATE) - 24, Y(0) - 58); g.lineTo(X(CRATE) + 24, Y(0) - 10); g.moveTo(X(CRATE) + 24, Y(0) - 58); g.lineTo(X(CRATE) - 24, Y(0) - 10); g.stroke();
	felt(rect(X(FLAG) - 4, Y(6), 8, 240, 4), '#ffffff', '#b0b0b0'); felt(trif(X(FLAG) + 4, Y(6) - 6, 54, 56), '#ff4d5e'); felt(circ(X(FLAG), Y(6.1), 10), '#ffd23f');
	COINS.forEach(([x, y]) => { felt(circ(X(x), Y(y), 19), '#ffc233', '#fff3b0'); g.fillStyle = '#b07a10'; [[-5, -5], [5, -5], [-5, 5], [5, 5]].forEach(([dx, dy]) => 0); g.fillStyle = '#a06a08'; for (const [dx, dy] of [[-4, -3], [4, -3], [-4, 4], [4, 4]]) { g.beginPath(); g.arc(X(x) + dx, Y(y) + dy, 2.2, 0, 7); g.fill(); } });
	HER.forEach(([x, y], i) => bean(x, y, HEX[i], i, 1));
	return { canvas: c };
}

	else { renderer.shadowMap.enabled = !S.noShadow; if (S.comp) { S.comp.setSize(W, H); S.comp.render(); } else renderer.render(S.scene, S.camera); url = renderer.domElement.toDataURL('image/png'); S.scene.traverse(o => o.geometry?.dispose()); }
