<body>
<h1>Estilos visuais para o jogo cooperativo (até 4 jogadores)</h1>
<p class="sub">Cada imagem é uma tela renderizada de verdade com three.js (não é animação). Vermelho, azul, verde e roxo = os 4 jogadores. Estrelas douradas = itens a coletar.</p>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720, R = 17;
const COL = [0xff4d5e, 0x3b9cff, 0x3ddc84, 0xb06bff];
const PL = [[-3.5, 2.5, 0], [3, 4, 0], [-0.5, -3, 1.5], [6.5, -1.5, 0]];      // x, z, altura do pulo
const COINS = [[0.5, 0.8], [-7, -2], [8, 3.5], [-2, 8], [3, -7], [-9, 5]];
const PROPS = [[0, -9, -4, 1.1], [0, 9, -7, 1.1], [0, -10, 6, 1.1], [0, 11, 5, 1.1], [0, 1, -11, 1.1], [1, -5, -8, 1], [1, 6, 8, 1.2], [1, -12, -1, 1], [2, 13, -3, 1.9], [2, -6, 11, 1.9]];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const rnd = (() => { let a = 5; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; })();

// ---------- utilidades ----------
const std = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .8, ...o });
const sun = (scene, p = [12, 26, 10], i = 2.4, c = 0xffffff) => { const l = new THREE.DirectionalLight(c, i); l.position.set(...p); l.castShadow = true; l.shadow.mapSize.set(2048, 2048); const k = l.shadow.camera; k.left = k.bottom = -26; k.right = k.top = 26; k.near = 1; k.far = 90; l.shadow.bias = -.0005; l.shadow.normalBias = .05; scene.add(l); return l; };
const shadows = o => o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
const persp = (fov = 42, pos = [0, 13, 17], look = [0, 0, 0]) => { const c = new THREE.PerspectiveCamera(fov, W / H, .5, 400); c.position.set(...pos.map(v=>v*1.45)); c.lookAt(...look); return c; };
const ortho = (half, pos, look = [0, 0, 0], up) => { const c = new THREE.OrthographicCamera(-half * W / H, half * W / H, half, -half, -100, 400); c.position.set(...pos); if (up) c.up.set(...up); c.lookAt(...look); return c; };
const gradBg = (a, b) => { const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1a1020, side: THREE.BackSide });
outlineMat.onBeforeCompile = s => { s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * 0.06;'); };
const addOutline = root => { const l = []; root.traverse(m => { if (m.isMesh && !m.userData.noOutline) l.push(m); }); l.forEach(m => { const o = new THREE.Mesh(m.geometry, outlineMat); o.userData.noOutline = true; m.add(o); }); };

// bichinho 3D usado em vários estilos: cada jogador tem silhueta diferente (chifres, orelhas, antena, crista)
function critter(color, i, o = {}) {
	const M = o.mat || (c => std(c, { flatShading: true })), g = new THREE.Group();
	const bg = o.geo === 'ico' ? new THREE.IcosahedronGeometry(.72, o.detail ?? 1) : o.geo === 'cap' ? new THREE.CapsuleGeometry(.55, .45, 6, 14) : new THREE.SphereGeometry(.72, 28, 18);
	const b = new THREE.Mesh(bg, M(color)); b.position.y = .85; b.scale.set(1, .92, .95); g.add(b);
	const w = M(0xffffff), k = M(0x1a1226), dark = M(new THREE.Color(color).multiplyScalar(.6).getHex());
	for (const s of [-1, 1]) {
		const e = new THREE.Mesh(new THREE.SphereGeometry(.2, 16, 12), w); e.position.set(s * .27, 1.05, .55); g.add(e);
		const p = new THREE.Mesh(new THREE.SphereGeometry(.1, 12, 10), k); p.position.set(s * .27, 1.05, .71); g.add(p);
		const f = new THREE.Mesh(new THREE.SphereGeometry(.22, 14, 10), dark); f.position.set(s * .32, .14, .12); f.scale.set(1, .6, 1.3); g.add(f);
	}
	const ex = i % 4, cream = M(0xfff1c9);
	if (ex === 0) for (const s of [-1, 1]) { const h = new THREE.Mesh(new THREE.ConeGeometry(.16, .5, 8), cream); h.position.set(s * .38, 1.6, 0); h.rotation.z = -s * .45; g.add(h); }
	if (ex === 1) for (const s of [-1, 1]) { const h = new THREE.Mesh(new THREE.SphereGeometry(.24, 14, 10), M(color)); h.position.set(s * .5, 1.5, 0); g.add(h); }
	if (ex === 2) { const st = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .45), cream); st.position.set(0, 1.78, 0); g.add(st); const bl = new THREE.Mesh(new THREE.SphereGeometry(.14, 12, 10), M(0xffd23f)); bl.position.set(0, 2.05, 0); g.add(bl); }
	if (ex === 3) for (let n = -1; n <= 1; n++) { const h = new THREE.Mesh(new THREE.ConeGeometry(.14, .42, 6), cream); h.position.set(0, 1.65 - Math.abs(n) * .08, n * .3); h.rotation.x = n * .5; g.add(h); }
	return g;
}
const gold = (m = 1) => { const s = new THREE.Shape(); for (let i = 0; i < 10; i++) { const r = i % 2 ? .28 : .6, a = i / 10 * 6.283 + 1.5708; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); } const g = new THREE.ExtrudeGeometry(s, { depth: .2, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 2 }); g.translate(0, 0, -.1); return g; };
const starMesh = (mat, y = 1.2, rot = .5) => { const m = new THREE.Mesh(gold(), mat); m.position.y = y; m.rotation.y = rot; return m; };
function layout(scene, S) {
	PL.forEach(([x, z, y], i) => { const h = S.hero(COL[i], i); h.position.set(x, y + (S.floorY || 0), z); h.rotation.y = S.noFace ? 0 : [.5, -.6, 2.4, -1.9][i]; scene.add(h); });
	COINS.forEach(([x, z], i) => { const c = S.coin(i); c.position.set(x, c.position.y + (S.floorY || 0), z); scene.add(c); });
	PROPS.forEach(([k, x, z, r], i) => { const p = S.prop(k, r, i); p.position.set(x, p.position.y + (S.floorY || 0), z); if (!S.noFace) p.rotation.y += i * 1.3; scene.add(p); });
}

// ================= 1 · LOW-POLY =================
function lowpoly() {
	const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fdcff); scene.fog = new THREE.Fog(0x8fdcff, 40, 110);
	scene.add(new THREE.HemisphereLight(0xdff6ff, 0x6a8f4a, 1.1)); sun(scene);
	const dirt = std(0xa86f45, { flatShading: true }), grass = std(0x7ed957, { flatShading: true });
	const isl = new THREE.Mesh(new THREE.CylinderGeometry(R + 3, R + 1, 2, 11), [dirt, grass, dirt]); isl.position.y = -1; scene.add(isl);
	const base = new THREE.Mesh(new THREE.ConeGeometry(R + 1, 9, 11), dirt); base.rotation.x = Math.PI; base.position.y = -6.5; scene.add(base);
	const sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), std(0x2fb4e8, { roughness: .3 })); sea.rotation.x = -Math.PI / 2; sea.position.y = -4; scene.add(sea);
	for (let i = 0; i < 60; i++) { const f = new THREE.Mesh(new THREE.OctahedronGeometry(.18, 0), std([0xffffff, 0xffd23f, 0xff8fb1][i % 3], { flatShading: true })); const a = rnd() * 6.28, d = Math.sqrt(rnd()) * (R - 1); f.position.set(Math.cos(a) * d, .15, Math.sin(a) * d); scene.add(f); }
	for (let i = 0; i < 8; i++) { const c = new THREE.Group(); for (let j = 0; j < 4; j++) { const p = new THREE.Mesh(new THREE.IcosahedronGeometry(2 + rnd() * 1.5, 0), std(0xffffff, { flatShading: true })); p.position.set(j * 2.2, rnd(), rnd() * 1.5); c.add(p); } c.position.set((rnd() - .5) * 90, 12 + rnd() * 8, -30 - rnd() * 30); scene.add(c); }
	layout(scene, {
		hero: (c, i) => { const g = critter(c, i, { geo: 'ico' }); shadows(g); return g; },
		coin: () => { const m = starMesh(std(0xffd23f, { emissive: 0x805500, flatShading: true })); m.castShadow = true; const g = new THREE.Group(); g.add(m); g.position.y = 1.2; return g; },
		prop: (k, r, i) => {
			const g = new THREE.Group();
			if (k === 0) { const t = new THREE.Mesh(new THREE.CylinderGeometry(.25, .35, 1.5, 6), std(0x8a5a30, { flatShading: true })); t.position.y = .75; g.add(t); [[1.5, 2.2, 1.8, 0x3fae4a], [1.1, 1.8, 3.1, 0x55c95b]].forEach(([rr, h, y, c]) => { const l = new THREE.Mesh(new THREE.ConeGeometry(rr, h, 7), std(c, { flatShading: true })); l.position.y = y; g.add(l); }); }
			if (k === 1) { const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r * 1.1, 0), std(0x9aa3ad, { flatShading: true })); m.position.y = r * .6; m.scale.y = .75; g.add(m); }
			if (k === 2) { const b = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 3), std(0xfff0d0, { flatShading: true })); b.position.y = 1; g.add(b); const rf = new THREE.Mesh(new THREE.ConeGeometry(2.6, 1.8, 4), std(0xe0524f, { flatShading: true })); rf.position.y = 2.9; rf.rotation.y = Math.PI / 4; g.add(rf); const d = new THREE.Mesh(new THREE.BoxGeometry(.7, 1.1, .1), std(0x6b4423)); d.position.set(0, .55, 1.52); g.add(d); }
			shadows(g); return g;
		}
	});
	return { scene, camera: persp(42, [0, 14, 18]) };
}

// ================= 2 · VOXEL (blocos) =================
function voxel() {
	const scene = new THREE.Scene(); scene.background = new THREE.Color(0x87ceff); scene.fog = new THREE.Fog(0x87ceff, 50, 120);
	scene.add(new THREE.HemisphereLight(0xffffff, 0x7a8a6a, 1.2)); sun(scene);
	const N = 40, cells = [];
	for (let x = -N / 2; x < N / 2; x++) for (let z = -N / 2; z < N / 2; z++) if (Math.hypot(x + .5, z + .5) < R + 3) cells.push([x + .5, z + .5]);
	const bx = new THREE.BoxGeometry(1, 1, 1), im = new THREE.InstancedMesh(bx, new THREE.MeshLambertMaterial(), cells.length), im2 = new THREE.InstancedMesh(bx, new THREE.MeshLambertMaterial(), cells.length * 3), m4 = new THREE.Matrix4();
	let n2 = 0; cells.forEach(([x, z], i) => { m4.makeTranslation(x, -.5, z); im.setMatrixAt(i, m4); im.setColorAt(i, new THREE.Color().setHSL(.28 + rnd() * .03, .6, .42 + rnd() * .08)); for (let y = 1; y <= 3; y++) { m4.makeTranslation(x, -.5 - y, z); im2.setMatrixAt(n2, m4); im2.setColorAt(n2++, new THREE.Color().setHSL(.07, .45, .3 + rnd() * .06)); } });
	im2.count = n2; im.castShadow = im.receiveShadow = im2.receiveShadow = true; scene.add(im, im2);
	const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshLambertMaterial({ color: 0x3a8fe0 })); water.rotation.x = -Math.PI / 2; water.position.y = -5.5; scene.add(water);
	for (let i = 0; i < 6; i++) { const c = new THREE.Group(); for (let j = 0; j < 5; j++) { const b = new THREE.Mesh(new THREE.BoxGeometry(3 + rnd() * 3, 1.2, 3), new THREE.MeshLambertMaterial({ color: 0xffffff })); b.position.set(j * 3, 0, rnd() * 3); c.add(b); } c.position.set((rnd() - .5) * 80, 14 + rnd() * 5, -28 - rnd() * 20); scene.add(c); }
	const L = c => new THREE.MeshLambertMaterial({ color: c }), box = (w, h, d, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), L(c)); m.position.set(x, y, z); return m; };
	layout(scene, {
		hero: (c, i) => { const g = new THREE.Group(); g.add(box(.9, .9, .9, c, 0, 1.75, 0), box(.9, 1, .5, new THREE.Color(c).multiplyScalar(.8).getHex(), 0, .85, 0), box(.3, .7, .3, 0x333344, -.25, .35, 0), box(.3, .7, .3, 0x333344, .25, .35, 0), box(.25, .8, .3, c, -.6, .9, 0), box(.25, .8, .3, c, .6, .9, 0), box(.22, .22, .08, 0xffffff, -.22, 1.85, .46), box(.22, .22, .08, 0xffffff, .22, 1.85, .46), box(.1, .12, .09, 0x111111, -.22, 1.85, .5), box(.1, .12, .09, 0x111111, .22, 1.85, .5)); if (i % 2) g.add(box(1, .25, 1, 0xffd23f, 0, 2.3, 0)); else { g.add(box(.2, .45, .2, 0xfff1c9, -.3, 2.4, 0), box(.2, .45, .2, 0xfff1c9, .3, 2.4, 0)); } shadows(g); return g; },
		coin: () => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(.7, .7, .25), new THREE.MeshLambertMaterial({ color: 0xffd23f, emissive: 0x705000 })); m.rotation.y = .6; m.castShadow = true; g.add(m); g.position.y = 1.2; return g; },
		prop: (k, r) => { const g = new THREE.Group(); if (k === 0) { for (let y = 0; y < 3; y++) g.add(box(.7, 1, .7, 0x7a4f2a, 0, y + .5, 0)); [[2.6, 1, 3.5], [2, 1, 4.5], [1, 1, 5.5]].forEach(([s, h, y]) => g.add(box(s * 1.2, 1, s * 1.2, 0x2e9e45, 0, y - .5 + 0.5, 0))); } if (k === 1) { g.add(box(1.6, 1, 1.6, 0x8d949c, 0, .5, 0), box(1, 1, 1, 0xa7aeb6, .2, 1.4, 0), box(.7, .7, .7, 0x777d85, -.8, .35, .9)); } if (k === 2) { g.add(box(3.2, 2.2, 3.2, 0xc98b4e, 0, 1.1, 0), box(3.6, .6, 3.6, 0xb83a3a, 0, 2.5, 0), box(2.4, .6, 2.4, 0xb83a3a, 0, 3.1, 0), box(1.2, .6, 1.2, 0xb83a3a, 0, 3.7, 0), box(.8, 1.3, .1, 0x5a3a1a, 0, .65, 1.65)); } shadows(g); return g; }
	});
	return { scene, camera: persp(42, [0, 14, 18]) };
}

// ================= 3 · TOON / DESENHO ANIMADO =================
function toon() {
	const scene = new THREE.Scene(); scene.background = gradBg('#6fd3ff', '#fff3b0'); scene.add(new THREE.HemisphereLight(0xffffff, 0xffd6f0, 1.6)); sun(scene, [10, 24, 14], 1.6);
	const gm = (() => { const d = new Uint8Array([90, 170, 255, 255]), t = new THREE.DataTexture(d.slice(0, 3).length ? new Uint8Array([100, 180, 255]) : d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
	const T = c => new THREE.MeshToonMaterial({ color: c, gradientMap: gm });
	const gc = document.createElement('canvas'); gc.width = gc.height = 512; const g2 = gc.getContext('2d'); g2.fillStyle = '#9af0c0'; g2.fillRect(0, 0, 512, 512); for (let i = 0; i < 60; i++) { g2.fillStyle = i % 2 ? '#b8ffd8' : '#7fe0a8'; g2.beginPath(); g2.arc(rnd() * 512, rnd() * 512, 10 + rnd() * 26, 0, 6.3); g2.fill(); } const gt = new THREE.CanvasTexture(gc); gt.colorSpace = THREE.SRGBColorSpace;
	const gnd = new THREE.Mesh(new THREE.CylinderGeometry(R + 1, R + 1, 1.4, 48), [T(0xff9ec7), new THREE.MeshToonMaterial({ map: gt, gradientMap: gm }), T(0xff9ec7)]); gnd.position.y = -.7; gnd.receiveShadow = true; addOutline(gnd); scene.add(gnd);
	for (let i = 0; i < 7; i++) { const c = new THREE.Group(); for (let j = 0; j < 3; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(2 + rnd(), 20, 14), T(0xffffff)); s.position.set(j * 2, 0, 0); c.add(s); } addOutline(c); c.position.set((rnd() - .5) * 80, 12 + rnd() * 8, -28 - rnd() * 14); scene.add(c); }
	layout(scene, {
		hero: (c, i) => { const g = critter(c, i, { mat: T }); addOutline(g); shadows(g); return g; },
		coin: () => { const g = new THREE.Group(), m = starMesh(T(0xffd23f)); m.scale.setScalar(1.2); g.add(m); addOutline(g); g.position.y = 1.3; return g; },
		prop: (k, r, i) => {
			const g = new THREE.Group();
			if (k === 0) { const s = new THREE.Mesh(new THREE.CylinderGeometry(.14, .18, 1.8, 10), T(0xffffff)); s.position.y = .9; g.add(s); const b = new THREE.Mesh(new THREE.SphereGeometry(1.25, 24, 18), T([0xff6fa8, 0xa56bff, 0xffa73d][i % 3])); b.position.y = 2.6; g.add(b); }
			if (k === 1) { const s = new THREE.Mesh(new THREE.CylinderGeometry(.35, .45, 1.1, 14), T(0xfff3e0)); s.position.y = .55; g.add(s); const c = new THREE.Mesh(new THREE.SphereGeometry(1.15, 24, 12, 0, 6.283, 0, 1.57), T(0xff4d4d)); c.position.y = 1.0; c.scale.y = .9; g.add(c); for (let n = 0; n < 5; n++) { const d = new THREE.Mesh(new THREE.SphereGeometry(.16, 10, 8), T(0xffffff)); const a = n * 1.26; d.position.set(Math.cos(a) * .7, 1.65 - (n % 2) * .15, Math.sin(a) * .7); g.add(d); } }
			if (k === 2) { const cone = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.6, 16), T(0xf2b36b)); cone.rotation.x = Math.PI; cone.position.y = 1.3; g.add(cone); [[1.1, 3, 0xff9ec7], [.95, 4.1, 0xb8f0ff]].forEach(([rr, y, c]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(rr, 24, 18), T(c)); s.position.y = y - .1; g.add(s); }); const ch = new THREE.Mesh(new THREE.SphereGeometry(.28, 12, 10), T(0xe5254b)); ch.position.y = 5.2; g.add(ch); }
			addOutline(g); shadows(g); return g;
		}
	});
	return { scene, camera: persp(40, [0, 13, 17.5]) };
}

// ================= 4 · BRINQUEDO / MASSINHA =================
function toy() {
	const scene = new THREE.Scene(); scene.background = new THREE.Color(0xffe9d6);
	const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .7;
	sun(scene, [-10, 26, 14], 2.2, 0xfff2e0);
	const P = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: .35, clearcoat: 1, clearcoatRoughness: .15, ...o });
	const mat = new THREE.Mesh(new THREE.CylinderGeometry(R + 2, R + 2, 1, 64), P(0xfff8ee, { roughness: .9, clearcoat: 0 })); mat.position.y = -.5; mat.receiveShadow = true; scene.add(mat);
	[R + 1.4, R - 1.5, R - 4].forEach((r, i) => { const rg = new THREE.Mesh(new THREE.TorusGeometry(r, .35, 16, 96), P([0xff8fb1, 0x8fd6ff, 0xffd86b][i])); rg.rotation.x = Math.PI / 2; rg.position.y = .05; rg.scale.z = .5; rg.receiveShadow = true; scene.add(rg); });
	const ltex = (ch, bg) => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 128, 128); g.fillStyle = '#fff'; g.font = 'bold 84px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ch, 64, 70); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
	layout(scene, {
		hero: (c, i) => { const g = critter(c, i, { geo: 'cap', mat: cc => P(cc) }); shadows(g); return g; },
		coin: () => { const g = new THREE.Group(), m = starMesh(P(0xffd23f, { metalness: .6, roughness: .2 })); m.scale.setScalar(1.2); m.castShadow = true; g.add(m); g.position.y = 1.3; return g; },
		prop: (k, r, i) => {

		prop: (k, r, i) => { const g = new THREE.Group(); const [rows, pal, w, h] = k === 0 ? [treeRows, treePal, 4, 4.3] : k === 1 ? [rockRows, rockPal, 2.4, 1.7] : [houseRows, housePal, 5.6, 3.1]; const o = 100 + Math.floor((i + 2) * 3); addShadow(g, w * .9, o); g.add(spr(tex(rows, pal), w, h, o)); return g; }
	});
	// ordem de desenho por profundidade (z maior = mais à frente)
	scene.traverse(o => { if (o.isMesh && o.renderOrder >= 100 && o.parent.parent === scene) { o.renderOrder = 100 + Math.round((o.parent.position.z + 30) * 10); } });
	scene.children.forEach(ch => { if (ch.isGroup) ch.traverse(m => { if (m.isMesh && m.renderOrder >= 100) m.renderOrder = 100 + Math.round((ch.position.z + 30) * 10) + (m.renderOrder % 1); }); });
	scene.children.forEach(ch => { if (ch.isGroup) { let bump = 0; ch.children.forEach((m, n) => { if (m.isMesh && m.renderOrder >= 100) m.renderOrder += n; }); } });
	return { scene, camera: ortho(19.5, [0, 40, 0], [0, 0, 0], [0, 0, -1]), noShadow: true };
}

// ================= 10 · PAPEL RECORTADO (papercraft) =================
function paper() {
	const scene = new THREE.Scene(); scene.background = new THREE.Color(0x24366b);
	scene.add(new THREE.HemisphereLight(0xfff4e8, 0x8aa0d8, 1.1)); const sn = sun(scene, [-14, 30, 12], 2.4, 0xfff0dc); sn.shadow.radius = 3;
	const nz = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * .06})`; g.fillRect(rnd() * 128, rnd() * 128, 1 + rnd() * 2, 1); } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t; })();
	const P = c => new THREE.MeshStandardMaterial({ color: c, roughness: 1, map: nz });
	const wavy = (r, amp, n) => { const s = new THREE.Shape(); for (let i = 0; i <= 120; i++) { const a = i / 120 * 6.283, rr = r + Math.sin(a * n) * amp; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } return s; };
	const layer = (r, amp, n, c, y, d = .5) => { const m = new THREE.Mesh(new THREE.ExtrudeGeometry(wavy(r, amp, n), { depth: d, bevelEnabled: false }), P(c)); m.rotation.x = -Math.PI / 2; m.position.y = y; m.castShadow = m.receiveShadow = true; scene.add(m); };
	layer(R + 12, 1.2, 7, 0x3a54a8, -3, .5); layer(R + 8, 1, 9, 0x4a74d8, -2, .5); layer(R + 4, .9, 11, 0xf0d9a8, -1, .6); layer(R + 1.5, .5, 13, 0x77c98a, 0, .6);
	const clouds = []; for (let i = 0; i < 5; i++) { const c = new THREE.Group(); for (let j = 0; j < 3; j++) { const d = new THREE.Mesh(new THREE.CylinderGeometry(1.5 + j * .2, 1.5 + j * .2, .3, 24), P(0xffffff)); d.position.set(j * 1.6 - 1.6, 0, j % 2 * .6); c.add(d); } c.position.set(-24 + i * 12, 6 + (i % 2) * 2, -6 + (i * 7) % 20 - 10); shadows(c); scene.add(c); }
	const FY = 0.6;
	const disc = (r, h, c, x, y, z, seg = 40) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), P(c)); m.position.set(x, y, z); return m; };
	layout(scene, {
		floorY: FY,
		hero: (c, i) => { const g = new THREE.Group(); g.add(disc(.85, .3, c, 0, .15, 0), disc(.55, .3, new THREE.Color(c).lerp(new THREE.Color(0xffffff), .5).getHex(), -.05, .4, -.08)); for (const s of [-1, 1]) { g.add(disc(.26, .22, 0xffffff, s * .32, .6, .42, 24), disc(.12, .2, 0x1a1226, s * .32, .72, .48, 16)); if (i % 2) g.add(disc(.25, .22, c, s * .62, .5, -.55, 20)); } if (i % 2 === 0) g.add(disc(.25, .25, 0xfff1c9, 0, .5, -.6, 3)); shadows(g); return g; },
		coin: () => { const g = new THREE.Group(), m = starMesh(P(0xffd23f), 1.2, 0); m.rotation.x = -Math.PI / 2; m.scale.setScalar(1.2); m.castShadow = true; g.add(m); g.position.y = .8; return g; },
		prop: (k, r, i) => {
			const g = new THREE.Group();
			if (k === 0) [[1.5, 1.1, 0x2f9e4f], [1.15, 1.5, 0x48bb68], [.75, 1.9, 0x7ddb8a]].forEach(([rr, y, c], n) => { const d = disc(rr, .3, c, 0, y, 0, 6 + i % 3 * 2); d.rotation.y = n; g.add(d); }), g.add(disc(.2, 1, 0x8a5a30, 0, .5, 0, 12));
			if (k === 1) g.add(disc(1.1, .6, 0x9aa3ad, 0, .3, 0, 6), disc(.65, .4, 0xc4ccd6, -.1, .8, -.1, 6));
			if (k === 2) { g.add(new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.8, 3.2), P(0xf6e2b0))); g.children[0].position.y = .9; for (const s of [-1, 1]) { const rf = new THREE.Mesh(new THREE.BoxGeometry(1.9, .25, 3.6), P(s > 0 ? 0xe0524f : 0xc23b3b)); rf.position.set(s * .8, 2.15, 0); rf.rotation.z = s * .55; g.add(rf); } }
			shadows(g); return g;
		}
	});
	return { scene, camera: persp(30, [0, 46, 18], [0, 0, 1]) };
}
