<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>10 · Final de anúncio (motion graphic → vídeo do autor)</title>
<style>
	* { margin: 0; padding: 0; }
	html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
	#stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
	body:not(.export) #stage { background: #333 ; }
	canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
	#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; padding: 8px 16px; background: rgba(0,0,0,.75); color: #ccc; font: 13px sans-serif; }
	#hud input { flex: 1; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hud"><button id="play">▶</button><input id="scrub" type="range" min="0" max="4.57" step="0.01" value="0"><span id="tc">0.00</span></div>
<script type="module">
// Final de anúncio: overlay transparente sobre FinalADS.mp4 (export com --bg). O vídeo roda desde o 1º quadro
// (nunca congela): no começo a tela é tinta com formas e um furo redondo sobre o rosto (a bolinha-avatar com o
// vídeo ao vivo dentro); o furo cresce suavemente até mostrar o vídeo inteiro.
const W = 1080, H = 1920, DURATION = 4.57;
const INK = "#1B1035", LIMA = "#C6FF00", COLS = ["#FF2E88", "#13C4A3", "#FF8A1F", "#FFD23F", "#C6FF00", "#FFFFFF"];
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;
const E = {
	expoOut: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
	cubicInOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
	backOut: x => { const c = 1.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const params = new URLSearchParams(location.search); if (params.has("export")) document.body.classList.add("export");
const g = document.getElementById("c").getContext("2d");

const FACE = [665, 610], R0 = 210, R1 = 1700, G0 = 1.35, G1 = 2.75;   // furo: rosto no vídeo; cresce de G0 a G1
const r = mulberry32(8);
const SH = Array.from({ length: 34 }, (_, i) => ({ a: r() * Math.PI * 2, d: 300 + r() * 420, s: 10 + r() * 22, k: i % 4, c: COLS[i % COLS.length], t0: .02 + r() * .3, sp: (r() - .5) * 3, ph: r() * 6 }));
const DOTS = [0, 1, 2].map(i => ({ c: COLS[i], a: i * 2.1 }));
function shape(s, x, y, size, rot, col, alpha) {
	g.save(); g.globalAlpha = alpha; g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.strokeStyle = col;
	if (s === 0) { g.beginPath(); g.arc(0, 0, size * .55, 0, 7); g.fill(); }
	else if (s === 1) { g.lineWidth = size * .32; g.beginPath(); g.arc(0, 0, size * .6, 0, 7); g.stroke(); }
	else if (s === 2) { g.beginPath(); g.roundRect(-size * .5, -size * .5, size, size, size * .2); g.fill(); }
	else { g.beginPath(); g.moveTo(0, -size * .7); g.lineTo(size * .62, size * .45); g.lineTo(-size * .62, size * .45); g.closePath(); g.fill(); }
	g.restore();
}
function renderAt(T) {
	T = clamp(T, 0, DURATION - 1e-4);
	g.clearRect(0, 0, W, H);
	const grow = E.cubicInOut(seg(T, G0, G1));
	if (grow < 1) {
		const pk = E.backOut(seg(T, .0, .55)), [cx, cy] = FACE;
		const R = lerp(R0 * pk * (1 + Math.sin(T * 4) * .015), R1, grow);
		const fade = 1 - seg(grow, .6, 1);                               // a camada toda some no fim, sem corte
		g.globalAlpha = fade;
		g.fillStyle = INK; g.fillRect(0, 0, W, H);
		const rg = g.createRadialGradient(cx, cy, 0, cx, cy, 950); rg.addColorStop(0, "rgba(255,46,136,.3)"); rg.addColorStop(1, "rgba(27,16,53,0)");
		g.fillStyle = rg; g.fillRect(0, 0, W, H);
		for (const s of SH) {
			const e = E.expoOut(seg(T, s.t0, s.t0 + .8)), d = s.d * e + R * .9 + Math.sin(T * 2 + s.ph) * 10;
			shape(s.k, cx + Math.cos(s.a + T * .12) * d, cy + Math.sin(s.a + T * .12) * d * 1.2, s.s * Math.min(1, e * 1.5), T * s.sp + s.ph, s.c, Math.min(1, e * 2) * fade);
		}
		for (const t0 of [.55, 1.0]) { const q = seg(T, t0, t0 + .7); if (q > 0 && q < 1) { g.strokeStyle = LIMA; g.globalAlpha = (1 - q) * .7 * fade; g.lineWidth = 8 * (1 - q) + 2; g.beginPath(); g.arc(cx, cy, R + 24 + E.expoOut(q) * 150, 0, 7); g.stroke(); } }
		g.globalAlpha = fade;
		// aros (antes do furo, para a borda interna ficar limpa)
		const ring = 1 - seg(grow, .35, .8);
		g.lineWidth = 14; g.strokeStyle = INK; g.beginPath(); g.arc(cx, cy, R + 6, 0, 7); g.stroke();
		g.globalAlpha = fade * ring; g.lineWidth = 12; g.strokeStyle = LIMA; g.beginPath(); g.arc(cx, cy, R + 18, 0, 7); g.stroke();
		g.save(); g.globalAlpha = ring * Math.min(1, pk) * fade; g.setLineDash([26, 22]); g.lineDashOffset = -T * 120; g.lineWidth = 6; g.strokeStyle = "#FFFFFF"; g.beginPath(); g.arc(cx, cy, R + 46, 0, 7); g.stroke(); g.restore();
		for (const o of DOTS) { const a = o.a + T * 2.4, rr = R + 46; g.globalAlpha = ring * Math.min(1, pk) * fade; g.fillStyle = o.c; g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 15, 0, 7); g.fill(); g.strokeStyle = INK; g.lineWidth = 5; g.stroke(); }
		// furo: o vídeo ao vivo aparece dentro
		g.globalAlpha = 1; g.globalCompositeOperation = "destination-out"; g.beginPath(); g.arc(cx, cy, Math.max(0, R), 0, 7); g.fill(); g.globalCompositeOperation = "source-over";
	}
	g.clearRect(0, 0, 1, 1);   // mantém o PNG sempre RGBA (bug do --bg com quadros opacos)
}

const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth / W, (innerHeight - 40) / H); stage.style.transform = `translate(-50%,-50%) translateY(-20px) scale(${s})`; }
if (params.has("export")) stage.style.cssText = "left:0;top:0;transform:none"; else { addEventListener("resize", fit); fit(); }
let cur = params.has('t') ? +params.get('t') : 0, playing = false, t0 = 0;
renderAt(cur);
window.__mg = { duration: DURATION, fps: 30, width: W, height: H, renderAt };
if (params.has('export') || params.has('nohud')) document.getElementById('hud').remove();
if (params.has('export')) window.__mg.loaded = true;
else {
	const sc = document.getElementById('scrub'), b = document.getElementById('play');
	b.onclick = () => { playing = !playing; t0 = performance.now() - cur * 1000; };
	sc.oninput = () => { cur = +sc.value; playing = false; };
	(function loop() { if (playing) { cur = (performance.now() - t0) / 1000; if (cur > DURATION) t0 = performance.now(), cur = 0; } sc.value = cur; document.getElementById('tc').textContent = cur.toFixed(2); renderAt(cur); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
