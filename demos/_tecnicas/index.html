	// ── 4. MASSINHA: esferas e cápsulas deformadas por ruído (marcas de dedo), material fosco com brilho de barro ──
	massinha() {
		cena.background = new THREE.Color('#F4C7A1');
		cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100); cam.position.set(0.6, 2.6, 9); cam.lookAt(0.4, 1.7, 0);
		const ruido = (x, y, z) => Math.sin(x * 5.1 + Math.sin(y * 3.3)) * Math.sin(y * 4.7 + z * 2.1) * Math.sin(z * 5.3 + x * 1.7);
		const barro = (geo, amp = 0.035) => { geo = geo.toNonIndexed ? geo : geo; const p = geo.attributes.position, n = geo.attributes.normal, v3 = new THREE.Vector3();
			for (let i = 0; i < p.count; i++) { v3.fromBufferAttribute(p, i); const k = ruido(v3.x * 1.3, v3.y * 1.3, v3.z * 1.3) * amp + Math.sin(v3.x * 38 + v3.y * 22) * amp * 0.18;
