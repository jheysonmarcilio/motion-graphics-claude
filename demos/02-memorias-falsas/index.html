<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>02 · Lembranças que você tem, mas nunca existiram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,600;0,800;1,300&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Inter, 'Segoe UI', sans-serif; color: #EEEAFF; }
	#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #06060C; transform-origin: 50% 50%; }
	#stage > canvas { position: absolute; inset: 0; width: 1920px !important; height: 1080px !important; }
	#ui { position: absolute; inset: 0; pointer-events: none; }
	.scene-ui { position: absolute; inset: 0; display: none; }
	.scene-ui > * { position: absolute; opacity: 0; visibility: hidden; text-shadow: 0 2px 24px rgba(0,0,0,.85); }
	#fade { position: absolute; inset: 0; background: #06060C; pointer-events: none; }

	/* tipografia da marca */
	.lbl { font-weight: 800; font-size: 30px; letter-spacing: .2em; text-transform: uppercase; color: #EEEAFF; white-space: nowrap; }
	.lbl.c { color: #3EE6FF; } .lbl.v { color: #B9A6FF; } .lbl.r { color: #FF5C7A; } .lbl.a { color: #FFB070; }
	.big { font-weight: 200; font-size: 190px; line-height: 1; letter-spacing: .02em; color: #EEEAFF; white-space: nowrap; }
	.big b { font-weight: 800; }
	.mid { font-weight: 300; font-size: 54px; letter-spacing: .02em; white-space: nowrap; }
	.q { font-weight: 800; font-size: 64px; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
	.it { font-weight: 300; font-style: italic; font-size: 40px; white-space: nowrap; color: #EEEAFF; }
	.sm { font-weight: 400; font-size: 24px; letter-spacing: .06em; color: #8A88A8; white-space: nowrap; }
	.src { left: 60px; bottom: 44px; font-weight: 400; font-size: 22px; color: #8A88A8; letter-spacing: .04em; white-space: nowrap; }
	.ill { font-weight: 600; font-size: 18px; letter-spacing: .18em; text-transform: uppercase; color: #8A88A8; border: 1px solid rgba(138,136,168,.6); border-radius: 3px; padding: 5px 10px; white-space: nowrap; }
	.cx { left: 0; right: 0; text-align: center; }

	/* HUD (fora do vídeo) */
	#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: rgba(0,0,0,.7); font: 13px 'Segoe UI', sans-serif; color: #ccc; z-index: 10; }
	#hud button { background: #222; color: #eee; border: 1px solid #444; padding: 5px 11px; cursor: pointer; border-radius: 4px; }
	#hud input { flex: 1; }
	#hud select { background: #222; color: #eee; border: 1px solid #444; padding: 4px; }
	#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font: 14px 'Segoe UI'; z-index: 20; background: #000; }
</style>
<script type="importmap">
{ "imports": {
	"three": "/three.js-master/build/three.module.js",
	"three/addons/": "/three.js-master/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
	<div id="ui"></div>
	<div id="fade"></div>
</div>
<div id="hud">
	<button id="play">⏸</button>
	<select id="jump"></select>
	<input id="scrub" type="range" min="0" max="600" step="0.01" value="0">
	<span id="tc">000.00</span>
	<span style="opacity:.6">Espaço · ←/→ · H</span>
</div>
<div id="loading">carregando…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
