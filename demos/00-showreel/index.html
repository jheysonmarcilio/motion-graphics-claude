<!DOCTYPE html>

<style>
	:root {
		--abismo:#06060C; --nevoa:#12122A; --sinapse:#3EE6FF; --consciente:#8B6CFF;
		--emocao:#FF5C7A; --luz:#EEEAFF; --eco:#8A88A8;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: var(--luz); }
	#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--abismo); overflow: hidden; }
	#stage canvas { position: absolute; inset: 0; width: 1920px !important; height: 1080px !important; }
	#ui { position: absolute; inset: 0; pointer-events: none; }
	.abs { position: absolute; will-change: transform, opacity, filter; }
	.letters span { display: inline-block; will-change: transform, opacity, filter; }

	/* Cena 1 — título */
	#title { text-shadow: 0 0 40px rgba(6,6,12,.9); left: 0; right: 0; top: 410px; text-align: center; font-weight: 800; font-size: 150px; letter-spacing: .18em; padding-left: .18em; }
	#subtitle { text-shadow: 0 0 18px #000, 0 0 36px #000; left: 0; right: 0; top: 610px; text-align: center; font-weight: 300; font-size: 40px; letter-spacing: .32em; color: var(--eco); text-transform: uppercase; }
	#subtitle b { color: var(--sinapse); font-weight: 400; }

	/* Cena 2 — contador */
	#neurons { left: 140px; bottom: 150px; }
	#neurons .num { font-size: 132px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
	#neurons .num small { font-size: 46px; font-weight: 300; color: var(--sinapse); margin-left: 14px; letter-spacing: .05em; }
	#neurons .cap { margin-top: 14px; font-size: 26px; letter-spacing: .3em; text-transform: uppercase; color: var(--eco); }
	#neurons .bar { height: 2px; background: linear-gradient(90deg, var(--sinapse), transparent); margin-top: 22px; transform-origin: 0 50%; }

	/* Cena 3 — dados */
	#panel { left: 1080px; top: 170px; width: 700px; }
	#ring { width: 380px; height: 380px; position: relative; }
	#ring svg { position: absolute; inset: 0; overflow: visible; }
	#ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 118px; font-weight: 200; font-variant-numeric: tabular-nums; }
	#ring .pct sup { font-size: 44px; color: var(--emocao); margin-left: 6px; font-weight: 300; }
	#panel .caption { margin-top: 30px; font-size: 34px; font-weight: 300; line-height: 1.35; }
	#panel .caption b { font-weight: 800; color: var(--emocao); }
	.bars { margin-top: 44px; width: 560px; }
	.row { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; font-size: 20px; letter-spacing: .25em; text-transform: uppercase; color: var(--eco); }
	.row .lbl { width: 150px; }
	.row .track { flex: 1; height: 6px; background: rgba(138,136,168,.15); border-radius: 3px; overflow: hidden; }
	.row .fill { height: 100%; transform-origin: 0 50%; border-radius: 3px; }
	.row .val { width: 70px; text-align: right; color: var(--luz); font-variant-numeric: tabular-nums; letter-spacing: .05em; }
	#footnote { left: 1080px; bottom: 60px; font-size: 16px; color: var(--eco); letter-spacing: .15em; opacity: 0; }
	#connector { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

	/* Cena 4 — logo */
	#logo { left: 0; right: 0; top: 440px; text-align: center; }
	#logo .word { font-size: 120px; font-weight: 800; letter-spacing: .5em; padding-left: .5em; }
	#logo .line { width: 520px; height: 2px; margin: 26px auto; background: linear-gradient(90deg, transparent, var(--sinapse), var(--consciente), transparent); }
	#logo .tag { font-size: 28px; font-weight: 300; letter-spacing: .45em; padding-left: .45em; text-transform: uppercase; color: var(--eco); }

	#fade { position: absolute; inset: 0; background: #000; }

	/* HUD (fora do vídeo) — H esconde */
	#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; align-items: center; padding: 10px 18px; background: rgba(0,0,0,.6); font: 13px/1 'Segoe UI', sans-serif; color: #ccc; z-index: 10; }
	#hud button { background: #222; color: #eee; border: 1px solid #444; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
	#hud input { flex: 1; }
	#hud .hint { opacity: .6; }
	#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font: 14px 'Segoe UI'; z-index: 20; background: #000; }
</style>

<body>
<div id="stage">
	<div id="ui">
		<div id="title" class="abs letters">SUA MENTE</div>
		<div id="subtitle" class="abs">decide <b>antes</b> de você</div>

		<div id="neurons" class="abs">
			<div class="num"><span id="nCount">0</span><small>bilhões</small></div>

		</div>

					<circle id="arc" cx="190" cy="190" r="150" fill="none" stroke="url(#grad)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 190 190)" />
					<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
						<stop offset="0" stop-color="#3EE6FF"/><stop offset=".6" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FF5C7A"/>
					</linearGradient></defs>
				</svg>

	<div id="fade"></div>
</div>

<div id="hud">
	<button id="play">⏸</button>
	<input id="scrub" type="range" min="0" max="15" step="0.01" value="0">
	<span id="tc">00.00 / 15.00</span>
	<span class="hint">Espaço: play/pause · ←/→: ±0.1s · H: esconder</span>
</div>
<div id="loading">carregando…</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ───────────────────────── utilidades de tempo ─────────────────────────
const W = 1920, H = 1080, DURATION = 15;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));           // progresso 0..1 do intervalo [a,b]
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
	expoOut: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
	expoIn: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
	expoInOut: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
	cubicInOut: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
	backOut: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
// entra em [a,b], sai em [c,d] → 0..1..0
const inOut = (t, a, b, c, d, eIn = ease.expoOut, eOut = ease.expoInOut) => eIn(seg(t, a, b)) * (1 - eOut(seg(t, c, d)));

// PRNG determinístico: mesmo resultado em todo render (essencial p/ exportar frames)
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(1337);
const C = hex => new THREE.Color(hex);
const PAL = { abismo: C('#06060C'), sinapse: C('#3EE6FF'), consciente: C('#8B6CFF'), emocao: C('#FF5C7A'), luz: C('#EEEAFF') };

// ───────────────────────── renderer / cena ─────────────────────────
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = PAL.abismo.clone();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.0, 0.65, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grain = new ShaderPass({
	uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
	vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
	fragmentShader: `
		uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
		float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
		void main(){
			vec3 c = texture2D(tDiffuse, vUv).rgb;
			float d = distance(vUv, vec2(.5)) * 1.25;
			c *= mix(1., .35, smoothstep(.35, 1., d));               // vinheta
			c += (hash(vUv * vec2(1920.,1080.) + fract(uTime * 24.) * 100.) - .5) * .045; // grão
			gl_FragColor = vec4(c, 1.);
		}`
});
composer.addPass(grain);

// ───────────────────────── material de pontos brilhantes ─────────────────────────
const pointVS = `
	attribute float aSize; uniform float uSize; uniform float uPx;
	void main(){
		vec4 mv = modelViewMatrix * vec4(position, 1.);
		gl_Position = projectionMatrix * mv;
		gl_PointSize = uSize * aSize * projectionMatrix[1][1] * uPx / -mv.z;
	}`;
const pointFS = `
	uniform vec3 uColor; uniform float uOpacity;
	void main(){
		float d = length(gl_PointCoord - .5);
		float a = smoothstep(.5, 0., d); a *= a;
		gl_FragColor = vec4(uColor, a * uOpacity);
	}`;
const glowMat = (color, size, opacity = 1) => new THREE.ShaderMaterial({
	uniforms: { uColor: { value: color.clone() }, uSize: { value: size }, uPx: { value: H * .5 }, uOpacity: { value: opacity } },
	vertexShader: pointVS, fragmentShader: pointFS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
function pointsGeo(positions, sizeFn = () => 1) {
	const g = new THREE.BufferGeometry();
	g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
	const s = new Float32Array(positions.length / 3).map((_, i) => sizeFn(i));
	g.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
	return g;
}

// ───────────────────────── poeira de fundo (profundidade) ─────────────────────────
const DUST = 1400, dustPos = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) { dustPos[i*3] = (rng()-.5)*60; dustPos[i*3+1] = (rng()-.5)*36; dustPos[i*3+2] = -rng()*40 - 4; }
const dust = new THREE.Points(pointsGeo(dustPos, () => .5 + rng()), glowMat(PAL.consciente, .09, .35));
scene.add(dust);

// ───────────────────────── rede neural ─────────────────────────
const network = new THREE.Group(); scene.add(network);
const NODES = 240, nodes = [];
for (let i = 0; i < NODES; i++) {
	// distribuição em elipsoide, mais densa no centro
	const u = rng(), v = rng(), r = Math.pow(rng(), .6);
	const th = u * Math.PI * 2, ph = Math.acos(2 * v - 1);
	nodes.push(new THREE.Vector3(Math.sin(ph)*Math.cos(th)*7.5*r, Math.cos(ph)*4.2*r, Math.sin(ph)*Math.sin(th)*5.5*r));
}
const edges = [], deg = new Array(NODES).fill(0);
for (let i = 0; i < NODES; i++) for (let j = i + 1; j < NODES; j++) {
	const d = nodes[i].distanceTo(nodes[j]);
	if (d < 1.9 && deg[i] < 5 && deg[j] < 5) { edges.push([i, j, (nodes[i].length() + nodes[j].length()) / 2]); deg[i]++; deg[j]++; }
}
edges.sort((a, b) => a[2] - b[2]);          // cresce do centro para fora
const ePos = new Float32Array(edges.length * 6);
edges.forEach(([a, b], k) => { nodes[a].toArray(ePos, k*6); nodes[b].toArray(ePos, k*6+3); });
const eGeo = new THREE.BufferGeometry(); eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
const eMat = new THREE.LineBasicMaterial({ color: PAL.sinapse, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false });
const lines = new THREE.LineSegments(eGeo, eMat); network.add(lines);

const nPos = new Float32Array(NODES * 3); nodes.forEach((n, i) => n.toArray(nPos, i*3));
const nodePts = new THREE.Points(pointsGeo(nPos, () => .6 + rng() * 1.2), glowMat(PAL.sinapse, .16, .9));
network.add(nodePts);

const PULSES = 320, pulseData = [];
for (let i = 0; i < PULSES; i++) pulseData.push({ e: Math.floor(rng() * edges.length), s: .4 + rng() * 1.1, o: rng(), dir: rng() < .5 });
const pPos = new Float32Array(PULSES * 3);
const pulsePts = new THREE.Points(pointsGeo(pPos, () => .7 + rng() * .6), glowMat(PAL.luz, .12, 1));
network.add(pulsePts);

const netRot = t => t * 0.08;

// ───────────────────────── cabeça de partículas ─────────────────────────
const head = new THREE.Group(); scene.add(head);
const headRot = t => -0.45 + 0.1 * t;
let headPts = null, headMat = null;
const shock = new THREE.Mesh(new THREE.RingGeometry(.96, 1, 128), new THREE.MeshBasicMaterial({ color: PAL.sinapse, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
scene.add(shock);

async function buildHead() {
	const gltf = await new GLTFLoader().loadAsync('/three.js-master/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb');
	let mesh; gltf.scene.traverse(o => { if (o.isMesh && !mesh) mesh = o; });
	const sampler = new MeshSurfaceSampler(mesh).setRandomGenerator(rng).build();
	const N = 16000, raw = new Float32Array(N * 3), nrm = new Float32Array(N * 3), v = new THREE.Vector3(), vn = new THREE.Vector3();
	mesh.geometry.computeBoundingBox(); const gb = mesh.geometry.boundingBox;
	const cutY = gb.min.y + (gb.max.y - gb.min.y) * .36; // corta os ombros: só cabeça + pescoço
	for (let i = 0; i < N; ) { sampler.sample(v, vn); if (v.y < cutY) continue; v.toArray(raw, i*3); vn.toArray(nrm, i*3); i++; }
	// normaliza: centraliza e escala p/ altura 3.3
	const box = new THREE.Box3().setFromArray(raw), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
	const k = 3.0 / size.y;
	const target = new Float32Array(N * 3), scatter = new Float32Array(N * 3), rand = new Float32Array(N), sz = new Float32Array(N);
	const ang = netRot(3) - headRot(3), ca = Math.cos(ang), sa = Math.sin(ang);
	for (let i = 0; i < N; i++) {
		target[i*3] = (raw[i*3] - ctr.x) * k; target[i*3+1] = (raw[i*3+1] - ctr.y) * k; target[i*3+2] = (raw[i*3+2] - ctr.z) * k;
		// cada partícula nasce num neurônio da rede (continuidade entre as cenas)
		const n = nodes[i % NODES], jx = (rng()-.5)*.5, jy = (rng()-.5)*.5, jz = (rng()-.5)*.5;
		const x = n.x + jx, z = n.z + jz;
		scatter[i*3] = x * ca + z * sa; scatter[i*3+1] = n.y + jy; scatter[i*3+2] = -x * sa + z * ca;
		rand[i] = rng(); sz[i] = .5 + rng() * rng() * 1.6;
	}
	const g = new THREE.BufferGeometry();
	g.setAttribute('position', new THREE.BufferAttribute(target, 3));
	g.setAttribute('aScatter', new THREE.BufferAttribute(scatter, 3));
	g.setAttribute('aNormal', new THREE.BufferAttribute(nrm, 3));
	g.setAttribute('aRand', new THREE.BufferAttribute(rand, 1));
	g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
	headMat = new THREE.ShaderMaterial({
		uniforms: {
			uMorph: { value: 0 }, uExplode: { value: 0 }, uCollapse: { value: 0 }, uTime: { value: 0 },
			uScanY: { value: 10 }, uScanAmt: { value: 0 }, uOpacity: { value: 0 }, uSize: { value: .03 }, uPx: { value: H * .5 },
			uA: { value: PAL.sinapse }, uB: { value: PAL.consciente }, uS: { value: PAL.emocao },
		},
		vertexShader: `
			attribute vec3 aScatter; attribute vec3 aNormal; attribute float aRand; attribute float aSize;
			uniform float uMorph, uExplode, uCollapse, uTime, uScanY, uScanAmt, uSize, uPx;
			uniform vec3 uA, uB, uS;
			varying vec3 vColor; varying float vAlpha;
			float expoOut(float x){ return x >= 1. ? 1. : 1. - pow(2., -10. * x); }
			vec3 rotY(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z); }
			void main(){
				float ny = clamp((position.y + 1.5) / 3.0, 0., 1.);
				// montagem: varre de baixo p/ cima + atraso aleatório
				float delay = aRand * .35 + (1. - ny) * .25;
				float m = expoOut(clamp((uMorph - delay) / .4, 0., 1.));
				vec3 swirl = vec3(sin(aRand*40. + uTime*1.3), cos(aRand*31. + uTime*1.1), sin(aRand*17. + uTime*.9)) * .25 * (1. - m);
				vec3 p = mix(aScatter, position, m) + swirl;
				p += vec3(sin(uTime*1.7 + aRand*60.), cos(uTime*1.3 + aRand*50.), 0.) * .008; // respiração
				// explosão: espirala para fora
				vec3 dir = normalize(position + vec3(.001));
				p = rotY(p + dir * uExplode * (.8 + aRand * 1.4), uExplode * (1.2 + aRand));
				p = mix(p, vec3(0.), uCollapse * (0.85 + .15 * aRand));
				// cor: base→topo + faixa de escaneamento
				float scan = exp(-pow((position.y - uScanY) / .07, 2.)) * uScanAmt;
				// rim: contorno brilha, frente fica sutil → revela o relevo do rosto
				vec3 vn = normalize(normalMatrix * aNormal);
				float rim = pow(1. - abs(vn.z), 2.);
				vColor = mix(uA, uB, ny) * (.55 + rim * 1.2) + uS * scan * 1.4;
				vAlpha = mix(.32, 1., rim) + scan * .8;
				vec4 mv = modelViewMatrix * vec4(p, 1.);
				gl_Position = projectionMatrix * mv;
				gl_PointSize = uSize * aSize * (1. + scan * 1.5) * projectionMatrix[1][1] * uPx / -mv.z;
			}`,
		fragmentShader: `
			uniform float uOpacity; varying vec3 vColor; varying float vAlpha;
			void main(){
				float d = length(gl_PointCoord - .5);
				float a = smoothstep(.5, 0., d); a *= a;
				gl_FragColor = vec4(vColor, a * vAlpha * uOpacity);
			}`,
		transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
	});
	headPts = new THREE.Points(g, headMat);
	headPts.frustumCulled = false;
	head.add(headPts);
}

// ───────────────────────── câmera (spline contínua — sem paradas) ─────────────────────────
const camPath = new THREE.CatmullRomCurve3([
	new THREE.Vector3(2.2, 1.6, 19), new THREE.Vector3(-.6, .4, 10.5), new THREE.Vector3(.5, .15, 8.4),
	new THREE.Vector3(.25, 0, 8.1), new THREE.Vector3(-.2, .1, 8.8), new THREE.Vector3(0, 0, 7.4)
], false, 'catmullrom', .5);

// ───────────────────────── overlay (HTML) ─────────────────────────
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
function splitLetters(el) { const txt = el.textContent; el.textContent = ''; return [...txt].map(ch => { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; el.appendChild(s); return s; }); }
const titleL = splitLetters($('#title')), logoL = splitLetters($('#logo .word'));
const ticks = $('#ticks'), TICKS = 60;
for (let i = 0; i < TICKS; i++) {
	const a = i / TICKS * Math.PI * 2 - Math.PI / 2, r1 = 172, r2 = i % 5 ? 178 : 186;
	const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
	l.setAttribute('x1', 190 + Math.cos(a)*r1); l.setAttribute('y1', 190 + Math.sin(a)*r1);
	l.setAttribute('x2', 190 + Math.cos(a)*r2); l.setAttribute('y2', 190 + Math.sin(a)*r2);
	l.setAttribute('stroke', '#8A88A8'); l.setAttribute('stroke-width', i % 5 ? 1 : 2);
	ticks.appendChild(l);
}
const tickEls = [...ticks.children];
const ARC = 2 * Math.PI * 150; $('#arc').setAttribute('stroke-dasharray', ARC);
const connPath = $('#connPath'), CONN = connPath.getTotalLength(); connPath.setAttribute('stroke-dasharray', CONN);
const bars = $$('.row'), barVals = [45, 35, 20];

function css(el, o, tx = 0, ty = 0, sc = 1, blur = 0) {
	el.style.opacity = o;
	el.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
	el.style.filter = blur > .05 ? `blur(${blur}px)` : 'none';
}

function updateUI(t) {
	// Cena 1 — título letra a letra
	titleL.forEach((s, i) => {
		const pIn = ease.expoOut(seg(t, .5 + i * .06, 1.5 + i * .06));
		const pOut = ease.expoInOut(seg(t, 2.6 + i * .025, 3.3 + i * .025));
		css(s, pIn * (1 - pOut), 0, (1 - pIn) * 60 - pOut * 30, 1, (1 - pIn) * 18 + pOut * 14);
	});
	const sub = inOut(t, 1.3, 2.2, 2.7, 3.3);
	css($('#subtitle'), sub, 0, (1 - ease.expoOut(seg(t, 1.3, 2.2))) * 20, 1, (1 - sub) * 8);

	// Cena 2 — contador de neurônios
	const nv = inOut(t, 4.8, 5.6, 7.0, 7.6);
	css($('#neurons'), nv, (1 - ease.expoOut(seg(t, 4.8, 5.6))) * -40, 0, 1, (1 - nv) * 10);
	$('#nCount').textContent = Math.round(86 * ease.expoOut(seg(t, 4.9, 6.6)));
	$('#neurons .bar').style.transform = `scaleX(${ease.expoOut(seg(t, 5.0, 6.4))})`;

	// Cena 3 — painel de dados
	const pv = inOut(t, 8.0, 8.8, 11.0, 11.6);
	css($('#panel'), pv, (1 - ease.expoOut(seg(t, 8.0, 8.8))) * 60, 0, 1, (1 - pv) * 10);
	const ringP = ease.expoOut(seg(t, 8.3, 10.0));
	$('#arc').setAttribute('stroke-dashoffset', ARC * (1 - .95 * ringP));
	$('#pct').textContent = Math.round(95 * ringP);
	tickEls.forEach((l, i) => l.style.opacity = ease.expoOut(seg(t, 8.1 + i * .012, 8.6 + i * .012)) * .8);
	bars.forEach((r, i) => {
		const bp = ease.expoOut(seg(t, 9.2 + i * .18, 10.4 + i * .18));
		r.style.opacity = ease.expoOut(seg(t, 9.0 + i * .18, 9.6 + i * .18));
		r.querySelector('.fill').style.transform = `scaleX(${bp * barVals[i] / 100})`;
		r.querySelector('.val').textContent = Math.round(bp * barVals[i]) + '%';
	});
	$('#footnote').style.opacity = inOut(t, 9.6, 10.2, 11.0, 11.5) * .7;
	const cv = ease.expoInOut(seg(t, 8.2, 9.0)) * (1 - ease.expoInOut(seg(t, 10.9, 11.4)));
	connPath.setAttribute('stroke-dashoffset', CONN * (1 - cv));
	connPath.style.opacity = cv * .8;
	$('#connDot').style.opacity = cv;

	// Cena 4 — logo
	logoL.forEach((s, i) => {
		const p = ease.expoOut(seg(t, 13.4 + i * .07, 14.3 + i * .07));
		css(s, p, 0, 0, 1.6 - .6 * p, (1 - p) * 20);
	});
	$('#logo .line').style.transform = `scaleX(${ease.expoInOut(seg(t, 13.5, 14.4))})`;
	css($('#logo .tag'), ease.expoOut(seg(t, 13.9, 14.6)), 0, (1 - ease.expoOut(seg(t, 13.9, 14.6))) * 14);

	// fade de abertura/fechamento
	$('#fade').style.opacity = Math.max(1 - ease.cubicInOut(seg(t, 0, .6)), ease.cubicInOut(seg(t, 14.55, 15)));
}

// ───────────────────────── estado 3D em função do tempo ─────────────────────────
const tmp = new THREE.Vector3();
function update3D(t) {
	// câmera
	camPath.getPoint(clamp(t / DURATION), camera.position);
	camera.position.x += Math.sin(t * .7) * .08; camera.position.y += Math.cos(t * .55) * .06; // drift orgânico
	camera.lookAt(0, 0, 0);

	dust.rotation.y = t * .01; dust.position.z = t * .25;

	// rede: cresce (0–2.2s) e some (3–4.2s)
	network.rotation.y = netRot(t);
	const grow = ease.expoOut(seg(t, .1, 2.4));
	eGeo.setDrawRange(0, Math.floor(grow * edges.length) * 2);
	const netFade = 1 - ease.expoInOut(seg(t, 3.0, 4.2));
	eMat.opacity = .22 * netFade;
	nodePts.material.uniforms.uOpacity.value = .9 * netFade * ease.expoOut(seg(t, 0, 1.2));
	pulsePts.material.uniforms.uOpacity.value = netFade * ease.expoOut(seg(t, .8, 2));
	for (let i = 0; i < PULSES; i++) {
		const p = pulseData[i], [a, b] = edges[p.e];
		const k = (t * p.s + p.o) % 1, kk = p.dir ? k : 1 - k;
		tmp.lerpVectors(nodes[a], nodes[b], kk).toArray(pPos, i * 3);
	}
	pulsePts.geometry.attributes.position.needsUpdate = true;
	pulsePts.geometry.setDrawRange(0, Math.floor(grow * PULSES));

	// cabeça
	if (headMat) {
		const u = headMat.uniforms;
		u.uTime.value = t;
		u.uMorph.value = seg(t, 3.0, 5.8) * 1.0;
		u.uOpacity.value = ease.expoOut(seg(t, 2.8, 3.6)) * (1 - ease.cubicInOut(seg(t, 13.2, 13.6)));
		u.uExplode.value = ease.expoOut(seg(t, 11.5, 12.7));
		u.uCollapse.value = ease.expoIn(seg(t, 12.5, 13.4));
		u.uScanAmt.value = inOut(t, 7.7, 8.2, 10.8, 11.3);
		u.uScanY.value = 1.8 - ((t - 7.7) / 1.6 % 1) * 3.6;
		head.rotation.y = headRot(t) + Math.sin(t * .6) * .05;
		head.rotation.x = Math.sin(t * .45) * .04;
		const side = ease.expoInOut(seg(t, 7.3, 8.4)) * (1 - ease.expoInOut(seg(t, 11.0, 11.8)));
		head.position.x = -1.45 * side;
	}

	// onda de choque no colapso
	const sh = seg(t, 13.3, 14.4);
	shock.visible = sh > 0 && sh < 1;
	shock.scale.setScalar(.1 + ease.expoOut(sh) * 9);
	shock.material.opacity = (1 - sh) * .9;
	shock.quaternion.copy(camera.quaternion);

	// bloom dramático por cena
	bloom.strength = 0.9 + .5 * inOut(t, 7.8, 8.4, 10.8, 11.3) + 2.2 * Math.exp(-Math.pow((t - 13.38) / .18, 2));
	bloom.radius = .6;
	grain.uniforms.uTime.value = t;
}

function renderAt(t) { t = clamp(t, 0, DURATION); update3D(t); updateUI(t); composer.render(); }

// ───────────────────────── player ─────────────────────────
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transformOrigin = '50% 50%'; stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

let playing = true, t0 = performance.now(), cur = 0;
const scrub = $('#scrub'), tc = $('#tc'), btn = $('#play');
const setPlay = p => { playing = p; btn.textContent = p ? '⏸' : '▶'; t0 = performance.now() - cur * 1000; };
btn.onclick = () => setPlay(!playing);
scrub.oninput = () => { cur = +scrub.value; setPlay(false); };
addEventListener('keydown', e => {
	if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
	if (e.code === 'ArrowRight') { cur = clamp(cur + .1, 0, DURATION); setPlay(false); }
	if (e.code === 'ArrowLeft') { cur = clamp(cur - .1, 0, DURATION); setPlay(false); }
	if (e.code === 'KeyH') $('#hud').style.display = $('#hud').style.display === 'none' ? '' : 'none';
});
const params = new URLSearchParams(location.search);
if (params.has('t')) { cur = +params.get('t'); setPlay(false); }
if (params.has('nohud')) $('#hud').style.display = 'none';

// API p/ exportação de vídeo quadro a quadro (puppeteer + ffmpeg)
window.__mg = { duration: DURATION, fps: 30, renderAt, ready: null };

window.__mg.ready = (async () => { await buildHead(); await document.fonts.ready; $('#loading').remove(); })();
await window.__mg.ready;
// ?export → sem loop: o exportador chama __mg.renderAt(t) quadro a quadro
if (params.has('export')) { $('#hud').remove(); window.__mg.loaded = true; }
else (function loop() {
	if (playing) cur = ((performance.now() - t0) / 1000) % DURATION;
	scrub.value = cur; tc.textContent = `${cur.toFixed(2).padStart(5, '0')} / ${DURATION.toFixed(2)}`;
	renderAt(cur);
	requestAnimationFrame(loop);
})();
</script>
</body>
