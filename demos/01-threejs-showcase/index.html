<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>01 · O que dá pra fazer com three.js</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: Inter, 'Segoe UI', sans-serif; color: #fff; }
	#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 50% 50%; }
	#stage > canvas { position: absolute; inset: 0; width: 1920px !important; height: 1080px !important; }
	#css2d { position: absolute; inset: 0; pointer-events: none; }
	#ui, #chrome { position: absolute; inset: 0; pointer-events: none; }
	.scene-ui { position: absolute; inset: 0; display: none; }
	#fade { position: absolute; inset: 0; background: #000; pointer-events: none; }

	/* cartão de capítulo */
	#chap { position: absolute; left: 60px; bottom: 56px; max-width: 1000px; padding: 22px 26px; background: rgba(6,8,14,.62); border-left: 3px solid #7fe7ff; border-radius: 4px; backdrop-filter: blur(6px); text-shadow: 0 2px 20px rgba(0,0,0,.7); }
	#chap .num { font: 700 20px 'JetBrains Mono', monospace; letter-spacing: .2em; color: #7fe7ff; }
	#chap .ttl { font-size: 60px; font-weight: 800; letter-spacing: -.01em; line-height: 1.05; margin: 8px 0 14px; }
	#chap .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
	#chap .tags span { font: 400 16px 'JetBrains Mono', monospace; padding: 6px 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; background: rgba(0,0,0,.35); backdrop-filter: blur(4px); }
	#chap .uses { font-size: 22px; font-weight: 300; color: rgba(255,255,255,.85); }
	#chap .uses b { font-weight: 600; color: #ffd166; }
	#counter { position: absolute; right: 70px; top: 56px; font: 400 18px 'JetBrains Mono', monospace; letter-spacing: .2em; color: rgba(255,255,255,.6); text-shadow: 0 0 10px #000; }
	#progress { position: absolute; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg,#7fe7ff,#b38cff); }

	/* etiquetas 3D */
	.tag3d { font: 600 18px Inter, sans-serif; padding: 6px 12px; background: rgba(10,12,20,.75); border: 1px solid rgba(255,255,255,.25); border-radius: 4px; white-space: nowrap; transition: none; }
	.tag3d small { display: block; font: 400 14px 'JetBrains Mono', monospace; color: #9fb3c8; margin-top: 2px; }
	.pin { border-left: 3px solid #ff4d6d; transform: translate(0, -40px); }
	.evid { background: #ffd400; color: #111; font: 800 22px 'JetBrains Mono', monospace; border: none; padding: 2px 8px; }
	.mat { background: transparent; border: none; text-align: center; font-size: 22px; text-shadow: 0 2px 10px #000; }
	.city { font-size: 15px; padding: 3px 8px; background: rgba(0,10,30,.6); border-color: rgba(127,231,255,.5); }

	/* HUD (fora do vídeo) */
	#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: rgba(0,0,0,.7); font: 13px 'Segoe UI', sans-serif; color: #ccc; z-index: 10; }
	#hud button { background: #222; color: #eee; border: 1px solid #444; padding: 5px 11px; cursor: pointer; border-radius: 4px; }
	#hud input { flex: 1; }
	#hud select { background: #222; color: #eee; border: 1px solid #444; padding: 4px; }
	#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font: 14px 'Segoe UI'; z-index: 20; background: #000; }
</style>
<script type="importmap">
{ "imports": {
	"three": "/three.js-master/build/three.module.js",
	"three/addons/": "/three.js-master/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
	<div id="css2d"></div>
	<div id="ui"></div>
	<div id="chrome">
		<div id="chap"><div class="num"></div><div class="ttl"></div><div class="tags"></div><div class="uses"></div></div>
		<div id="counter"></div>
		<div id="progress"></div>
	</div>
	<div id="fade"></div>
</div>
<div id="hud">
	<button id="play">⏸</button>
	<select id="jump"></select>
	<input id="scrub" type="range" min="0" max="120" step="0.01" value="0">
	<span id="tc">000.00</span>
	<span style="opacity:.6">Espaço · ←/→ · H</span>
</div>
<div id="loading">carregando cenas…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
