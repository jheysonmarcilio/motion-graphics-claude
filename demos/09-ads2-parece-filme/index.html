<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>09 · ADS2 Parece filme (overlay 9:16, trailer de cinema)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&family=JetBrains+Mono:wght@700;800&family=Archivo+Black&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,900;1,900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
	#stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 50% 50%; }
	#stage > * { position: absolute; inset: 0; width: 1080px; height: 1920px; }
	#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: rgba(0,0,0,.75); font: 13px 'Segoe UI', sans-serif; color: #ccc; z-index: 10; }
	#hud button { background: #222; color: #eee; border: 1px solid #444; padding: 5px 11px; cursor: pointer; border-radius: 4px; }
	#hud input[type=range] { flex: 1; }
	html.export, html.export body { background: transparent; }
</style>
</head>
<body>
<div id="stage">
	<video id="bg" src="/ADS2%20-%20Parece%20filme.mp4" preload="auto" playsinline></video>
	<canvas id="c" width="1080" height="1920"></canvas>
</div>
<div id="hud">
	<button id="play">▶</button>
	<input id="scrub" type="range" min="0" max="44.3" step="0.01" value="0">
	<span id="tc">00.00</span>
	<span style="opacity:.6">Espaço · ←/→ · H · V (vídeo)</span>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
