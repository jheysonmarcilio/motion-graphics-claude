<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estúdio — canais automáticos</title>
<style>
:root{--bg:#f4f5fa;--p1:#ffffff;--p2:#f6f7fb;--p3:#e6e8f0;--tx:#1d2133;--mut:#6b7186;--ac:#5b4cf0;--ac-l:#efedff;--ac2:#0f9d7a;--ok:#16a34a;--ok-l:#e8f7ee;--warn:#d97706;--warn-l:#fff5e6;--err:#dc2626;--err-l:#fdecec;--run:#2563eb;--r:16px;--sh:0 1px 2px #1d21330d,0 6px 20px #1d21330a}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:var(--ac);font-weight:600}button,input,select,textarea{font:inherit;color:inherit}code{background:var(--p2);border:1px solid var(--p3);padding:2px 6px;border-radius:6px;font-size:.85rem;word-break:break-all}
header{display:flex;align-items:center;gap:18px;padding:12px 28px;background:var(--p1);border-bottom:1px solid var(--p3);position:sticky;top:0;z-index:5;flex-wrap:wrap;box-shadow:var(--sh)}
header h1{font-size:1.25rem;margin:0;white-space:nowrap}header h1 b{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;padding:10px 16px;border-radius:12px;color:var(--mut);cursor:pointer;font-weight:600;font-size:1rem}nav button:hover{background:var(--p2);color:var(--tx)}nav button.on{background:var(--ac-l);color:var(--ac)}
#hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}#fcanal{width:auto;padding:8px 12px}
#ag{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600;padding:8px 14px;border-radius:30px;background:var(--err-l);color:var(--err);cursor:pointer}#ag.on{background:var(--ok-l);color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--err);display:inline-block;flex:none}.dot.on{background:var(--ok);box-shadow:0 0 0 4px #16a34a22}
#banner{display:none;background:var(--err-l);color:#991b1b;border-bottom:1px solid #f5c2c2;padding:12px 28px;font-weight:600;text-align:center}#banner button{margin-left:10px}
main{max-width:1180px;margin:0 auto;padding:28px}
.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:960px){.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}main{padding:16px}header{padding:10px 14px}}
@media(max-width:560px){.g4,.g3{grid-template-columns:1fr}}
.card{background:var(--p1);border:1px solid var(--p3);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:700}
h2{font-size:1.5rem;margin:0 0 6px}.titulo{font-size:1.9rem;font-weight:800;margin:0}.sub{color:var(--mut);font-size:1.05rem;margin:4px 0 24px}
.big{font-size:2.2rem;font-weight:800;line-height:1.1}.mut{color:var(--mut)}.small{font-size:.875rem}
.btn{background:var(--p1);border:1.5px solid var(--p3);padding:10px 18px;border-radius:12px;cursor:pointer;white-space:nowrap;font-weight:600;text-decoration:none;color:var(--tx);display:inline-flex;align-items:center;gap:6px}.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{filter:brightness(1.08);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.dan{color:var(--err)}.btn.sm{padding:6px 12px;font-size:.875rem;border-radius:10px}
.btn.xl{padding:16px 28px;font-size:1.15rem;border-radius:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
input[type=text],input[type=password],input[type=time],input[type=number],input[type=datetime-local],select,textarea{background:var(--p1);border:1.5px solid var(--p3);border-radius:12px;padding:11px 14px;width:100%;font-size:1rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-l)}
input[type=color]{width:48px;height:42px;border:0;background:none;padding:0}input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--ac)}
textarea{min-height:80px;resize:vertical}textarea.code{font:.85rem/1.5 ui-monospace,Consolas,monospace;min-height:380px}
label.f{display:block;margin:14px 0 6px;color:var(--tx);font-size:.9rem;font-weight:600}
.list .it{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--p3);cursor:pointer;border-radius:12px}.list .it:hover{background:var(--p2)}.list .it:last-child{border-bottom:0}
.pipe{display:flex;gap:3px}.pipe i{width:14px;height:8px;border-radius:4px;background:var(--p3)}
.s-feito,.s-pulado{background:var(--ok)!important}.s-pulado{opacity:.3}.s-rodando{background:var(--run)!important;animation:pulse 1.2s infinite}.s-aprovacao,.s-aguardando{background:var(--warn)!important}.s-erro{background:var(--err)!important}
@keyframes pulse{50%{opacity:.4}}@keyframes gira{to{transform:rotate(360deg)}}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.8rem;font-weight:600;background:var(--p2);color:var(--mut);white-space:nowrap;border:1px solid var(--p3)}
.tag.feito,.tag.concluido{color:var(--ok);background:var(--ok-l);border-color:#c9ecd6}.tag.rodando{color:var(--run);background:#eaf1fe;border-color:#cddcfb}.tag.aprovacao,.tag.aguardando,.tag.pausado{color:var(--warn);background:var(--warn-l);border-color:#f8dcae}.tag.erro,.tag.cancelado{color:var(--err);background:var(--err-l);border-color:#f5c2c2}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#modal{position:fixed;inset:0;background:#1d213380;display:none;z-index:10;overflow:auto;padding:30px 12px;backdrop-filter:blur(2px)}#modal .box{max-width:1000px;margin:0 auto;background:var(--bg);border-radius:20px;padding:28px;box-shadow:0 20px 60px #0003}
.etapa{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--p3)}
.etapa .n{width:34px;height:34px;border-radius:50%;background:var(--p3);display:grid;place-items:center;font-size:.9rem;font-weight:800;color:#fff}
.leit{background:var(--p1);border:1px solid var(--p3);border-radius:12px;padding:14px 18px;max-height:340px;overflow:auto;margin:8px 0 0;font-size:.93rem;line-height:1.55}
.leit .ln{padding:3px 0}.leit .ac{color:var(--mut);font-size:.85rem}.leit .ok{color:#1a8f4c;font-weight:600}.leit .er{color:var(--err)}.leit .msg{background:var(--ac-l);border-radius:10px;padding:8px 12px;margin:6px 0}
.leit .fala{display:flex;gap:10px;padding:3px 0}.leit .fala b{color:var(--ac);min-width:44px;font-variant-numeric:tabular-nums}
.doc{background:var(--p1);border:1px solid var(--p3);border-radius:12px;padding:18px 24px;margin-top:10px;max-height:62vh;overflow:auto;line-height:1.6}
.doc h1{font-size:1.35rem;margin:.4em 0}.doc h2{font-size:1.15rem;margin:1.1em 0 .4em;color:var(--ac)}.doc h3{font-size:1rem;margin:1em 0 .3em}.doc ul{padding-left:22px;margin:.3em 0}.doc p{margin:.45em 0}
.doc table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.9rem}.doc td,.doc th{border:1px solid var(--p3);padding:6px 9px;vertical-align:top;text-align:left}.doc th{background:var(--p2)}.doc code{background:var(--p2);border-radius:5px;padding:0 4px;font-size:.88em}.doc blockquote{border-left:3px solid var(--ac);margin:.5em 0;padding:2px 12px;color:var(--mut)}
.doc .campo{margin-bottom:12px}.doc .campo .k{font-size:.8rem;color:var(--mut);font-weight:600;text-transform:uppercase}.doc .tags span{display:inline-block;background:var(--p2);border-radius:20px;padding:2px 10px;margin:2px}
pre.log{background:#0f1220;color:#d6d9e6;border-radius:12px;padding:12px;max-height:260px;overflow:auto;font:.8rem/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:8px 0 0}
.tabs{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}.tabs button{background:var(--p1);border:1.5px solid var(--p3);border-radius:30px;padding:8px 16px;cursor:pointer;color:var(--mut);font-weight:600}.tabs button.on{border-color:var(--ac);color:var(--ac);background:var(--ac-l)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips label{background:var(--p1);border:1.5px solid var(--p3);padding:8px 14px;border-radius:30px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-weight:600}.chips input{display:none}.chips label:has(input:checked){border-color:var(--ac);background:var(--ac-l);color:var(--ac)}.chips label.off{opacity:.45}
.hint{background:var(--warn-l);border:1px solid #f8dcae;color:#8a4b00;border-radius:12px;padding:12px 16px;font-size:.92rem;margin-top:10px}
.info{background:#eef3ff;border:1px solid #d3defb;color:#1e3a8a;border-radius:12px;padding:12px 16px;font-size:.92rem;margin-top:10px}
video{width:100%;max-height:520px;background:#000;border-radius:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:14px 22px;border-radius:14px;display:none;z-index:20;font-weight:600;box-shadow:0 10px 30px #0003}
#login{max-width:420px;margin:90px auto}
.empty{padding:32px;text-align:center;color:var(--mut)}
.est{border-left:6px solid var(--c,#888)}.est img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:10px 0 2px;display:block}
.chips.img label{flex-direction:column;align-items:stretch;padding:6px;border-radius:12px;width:150px;font-size:.85rem}.chips.img img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block}.chips.img span.nm{display:flex;align-items:center;gap:6px;padding:2px 4px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0 18px}.passos div{background:var(--p1);border:1.5px solid var(--p3);border-radius:12px;padding:10px 12px;font-size:.88rem}.passos b{display:block;margin-bottom:3px}
.sug{border:1.5px solid var(--p3);border-radius:12px;padding:10px 14px;margin:8px 0}.sug p{margin:4px 0;font-size:.9rem}.est.off{opacity:.55}
.ch{border-top:6px solid var(--c,#888)}
body.fora header{display:none}#nl:empty{display:none}#nl{background:var(--err);color:#fff;border-radius:10px;padding:0 7px;font-size:.75rem}
.kpi{display:flex;gap:14px;align-items:center}.kpi .ic{font-size:1.8rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--ac-l);flex:none}
.check{list-style:none;padding:0;margin:12px 0 0}.check li{display:flex;gap:10px;align-items:center;padding:6px 0;font-weight:600}.check li .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;flex:none;border:2px solid var(--p3);color:var(--mut)}.check li.ok .b{background:var(--ok);border-color:var(--ok);color:#fff}.check li.ok{color:var(--mut)}
.prog{height:10px;border-radius:6px;background:var(--p3);overflow:hidden;display:flex}.prog i{display:block;height:100%}
/* tela de conexão */
.onb{max-width:760px;margin:40px auto}.onb .card{padding:34px}.passo{display:grid;grid-template-columns:52px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--p3)}.passo:last-child{border-bottom:0}
.passo .num{width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:800}.passo h3{text-transform:none;letter-spacing:0;font-size:1.2rem;color:var(--tx);margin:6px 0}
.passo.feito .num{background:var(--ok)}.espera{display:flex;align-items:center;gap:14px;font-size:1.1rem;font-weight:700;color:var(--ac)}.roda{width:28px;height:28px;border:4px solid var(--ac-l);border-top-color:var(--ac);border-radius:50%;animation:gira 1s linear infinite}
.sucesso{text-align:center;padding:30px}.sucesso .ic{font-size:4rem}

.clic{cursor:pointer;transition:transform .1s,box-shadow .1s}.clic:hover{transform:translateY(-2px);box-shadow:0 10px 30px #1d21331a}
.quadro{display:grid;gap:14px;align-items:start}@media(max-width:960px){.quadro{grid-template-columns:1fr!important}}
.coluna{background:var(--p2);border:1px solid var(--p3);border-radius:var(--r);padding:12px;min-height:80px}
.coltit{font-weight:700;padding:4px 6px 10px;border-bottom:3px solid;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.vid{background:var(--p1);border:1px solid var(--p3);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh)}.vid:hover{border-color:var(--ac)}
.chave{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}.chave input{display:none}.chave span{width:54px;height:30px;border-radius:30px;background:var(--p3);position:relative;transition:.2s;flex:none}
.chave span:after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}
.chave input:checked+span{background:var(--ok)}.chave input:checked+span:after{left:27px}.chave.pequena span{width:44px;height:24px}.chave.pequena span:after{width:18px;height:18px}.chave.pequena input:checked+span:after{left:23px}
.card.ligado{border:2px solid var(--ok)}
.fila{margin-top:12px;max-height:520px;overflow:auto}.tema{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--p3);border-radius:12px;margin-bottom:8px;background:var(--p1)}
.ordem{width:28px;height:28px;border-radius:50%;background:var(--ac-l);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.btn:disabled{opacity:.4;cursor:default}
.funil{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin-top:8px}.passoF{flex:1;min-width:110px;text-align:center;background:var(--p2);border:1px solid var(--p3);border-radius:14px;padding:12px 6px}.passoF .ic{font-size:1.4rem}.seta{display:grid;place-items:center;color:var(--mut);font-weight:800}
@media(max-width:700px){.seta{display:none}}
.piloto{border-left:6px solid var(--p3)}.piloto.ligado{border:2px solid var(--ok);border-left:6px solid var(--ok)}
</style>
</head>
<body>
<header>
	<h1>🎬 <b>Estúdio</b></h1>
	<nav id="nav"><button data-v="inicio" class="on">🏠 Início</button><button data-v="canais">📺 Canais</button><button data-v="videos">🎬 Vídeos</button><button data-v="thumbs">🖼️ Thumbnails</button><button data-v="pesquisas">🔎 Pesquisas</button><button data-v="estilos">🎨 Estilos</button><button data-v="ajustes">⚙️ Ajustes</button><button data-v="usuarios" id="nav-usuarios" style="display:none">👥 Usuários</button></nav>
	<div id="hdr-r"><button class="btn sm" id="sino" onclick="verAvisos()" title="Avisos">🔔 <span id="nl"></span></button><div id="ag"><span class="dot"></span><span>…</span></div></div>
</header>
<div id="banner">⚠️ Seu computador está desconectado — nenhum vídeo está sendo feito agora. <button class="btn sm" onclick="telaConectar(true)">Como reconectar</button></div>
<main id="app"></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
const API = location.pathname.replace(/[^/]*$/, '') + 'api';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let E = null, CFG = null, view = 'inicio', canalAberto = null, jobAberto = null, abaJob = 'etapas', arqSel = null, editando = false, filtroCanal = '';
let sujoPag = false, conectando = false, verSemPC = sessionStorage.verSemPC === '1';
const ESTADO = { pendente: 'na fila', rodando: 'fazendo agora', aprovacao: 'esperando você', aguardando: 'esperando', feito: 'feito', pulado: 'pulado', erro: 'erro' };
const STATUS = { ativo: 'em produção', pausado: 'pausado', concluido: 'publicado', cancelado: 'cancelado' };
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const PRIV = { private: 'Privado', unlisted: 'Não listado', public: 'Público' };
const VOZES = [['pt-BR-AntonioNeural', 'Antonio (masculina, BR)'], ['pt-BR-FranciscaNeural', 'Francisca (feminina, BR)'], ['pt-BR-ThalitaMultilingualNeural', 'Thalita (feminina, BR)'], ['pt-PT-DuarteNeural', 'Duarte (masculina, PT)'], ['pt-PT-RaquelNeural', 'Raquel (feminina, PT)'], ['en-US-AndrewMultilingualNeural', 'Andrew (EN)'], ['en-US-AvaMultilingualNeural', 'Ava (EN)'], ['es-MX-JorgeNeural', 'Jorge (ES)']];
const toast = m => { if (!m) return; const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2800); };
const canalDe = id => E.canais.find(c => c.id === id) || { nome: '?', cor: '#888', youtube: {}, estilos: [], pilotos: [] };
const estiloDe = id => E.estilos.find(e => e.id === id);
const nomeEtapa = id => (CFG?.etapas.find(e => e.id === id) || { nome: id === 'pesquisa' ? 'Pesquisa de temas' : id }).nome;
const opcoes = (lista, sel) => lista.map(([v, n]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');

async function api(rota, metodo = 'GET', dados, raw) {
	const r = await fetch(API + rota, { method: metodo, headers: raw ? {} : { 'Content-Type': 'application/json' }, body: raw || (dados ? JSON.stringify(dados) : undefined) });
	const j = await r.json().catch(() => ({}));
	if (r.status === 401 && j.login) { telaLogin(); throw new Error('login'); }
	if (!r.ok) { toast(j.erro || 'Erro ' + r.status); throw new Error(j.erro); }
	return j;
}

// ══════════ Login ══════════
async function telaLogin() {
	clearInterval(window._poll); $('#modal').style.display = 'none';
	const s = await fetch(API + '/sessao').then(r => r.json()).catch(() => ({}));
	document.body.classList.add('fora');
	$('#app').innerHTML = `<div id="login" class="card"><div class="titulo">🎬 Estúdio</div><p class="sub">${s.precisaSetup ? 'Primeiro acesso: crie a conta de administrador.' : 'Entre com seu login.'}</p>
	${s.precisaSetup ? '<label class="f">Seu nome</label><input type="text" id="lg_nome">' : ''}
	<label class="f">Login</label><input type="text" id="lg_login" autocomplete="username">
	<label class="f">Senha${s.precisaSetup ? ' (mínimo 8 caracteres)' : ''}</label><input type="password" id="lg_senha" autocomplete="${s.precisaSetup ? 'new-password' : 'current-password'}">
	<div class="row" style="margin-top:18px"><span class="sp"></span><button class="btn pri xl" id="lg_ok">${s.precisaSetup ? 'Criar administrador' : 'Entrar'}</button></div></div>`;
	const ok = async () => { await api(s.precisaSetup ? '/setup' : '/login', 'POST', { login: $('#lg_login').value, senha: $('#lg_senha').value, nome: $('#lg_nome')?.value }); document.body.classList.remove('fora'); iniciar(); };
	$('#lg_ok').onclick = ok; $('#lg_senha').onkeydown = e => e.key === 'Enter' && ok();
}
async function sair() { await fetch(API + '/logout'); sessionStorage.clear(); location.reload(); }

// ══════════ Atualização e navegação ══════════
async function atualizar() {
	E = await api('/estado');
	$('#nl').textContent = E.naoLidos || '';
	const a = E.agente;
	$('#ag').className = a.online ? 'on' : ''; $('#ag').onclick = () => telaConectar(true);
	$('#ag').innerHTML = `<span class="dot ${a.online ? 'on' : ''}"></span><span>${a.online ? (a.ocupado ? 'Fazendo: ' + nomeEtapa(a.ocupado.etapa) : 'Computador conectado') : 'Computador desconectado'}</span>`;
	$('#banner').style.display = !a.online && !conectando ? 'block' : 'none';
	if (conectando) { if (a.online) conectado(); return; }
	const ae = document.activeElement, digitando = ae && $('#app').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
	if (!editando && !sujoPag && !digitando) render();
	if (jobAberto) abrirJob(jobAberto, true);
}
function ir(v, extra) {
	view = v; if (v === 'canal') canalAberto = extra; editando = false; sujoPag = false; fechar(true);
	$$('#nav button').forEach(x => x.classList.toggle('on', x.dataset.v === (v === 'canal' ? 'canais' : v)));
	render(); scrollTo(0, 0); rota();
}
$$('#nav button').forEach(b => b.onclick = () => ir(b.dataset.v));
function render() { ({ inicio, canais, canal: paginaCanal, videos, thumbs, pesquisas, estilos, ajustes, usuarios })[view](); }

// ══════════ Vídeos: classificação ══════════
const precisa = j => j.status === 'ativo' && j.atual && (['aprovacao', 'erro'].includes(j.etapas[j.atual]) || (j.atual === 'narracao' && j.etapas.narracao === 'aguardando'));
const GRUPOS = [
	['voce', '✋ Esperando você', precisa, 'var(--warn)'],
	['fazendo', '🎬 Sendo feitos', j => j.status === 'ativo' && j.atual !== 'publicar' && !precisa(j), 'var(--run)'],
	['prontos', '📦 Prontos para publicar', j => j.status === 'ativo' && j.atual === 'publicar' && !precisa(j), 'var(--ok)'],
	['publicados', '✅ Publicados', j => j.status === 'concluido', 'var(--mut)'],
	['parados', '⏸ Parados', j => ['pausado', 'cancelado'].includes(j.status), 'var(--mut)']];
const pipe = j => `<div class="pipe">${CFG.etapas.map(e => `<i class="s-${j.etapas[e.id]}" title="${e.nome}: ${ESTADO[j.etapas[e.id]]}"></i>`).join('')}</div>`;
const tagEstilo = id => { const e = estiloDe(id); return e ? `<span class="tag"><span class="cdot" style="background:${e.cor}"></span>${esc(e.nome)}</span>` : ''; };
function cartaoVideo(j, comCanal) {
	const c = canalDe(j.canalId), at = j.atual && j.status === 'ativo';

		${j.motivo && precisa(j) ? `<div class="small" style="color:var(--warn);margin-top:4px">${esc(j.motivo.slice(0, 140))}</div>` : ''}
		<div class="row" style="margin-top:8px">${pipe(j)}<span class="sp"></span>${tagEstilo(j.estilo)}${j.url ? `<a class="small" href="${esc(j.url)}" target="_blank" onclick="event.stopPropagation()">YouTube ↗</a>` : ''}</div></div>`;

function quadro(js, comCanal, grupos = ['voce', 'fazendo', 'prontos', 'publicados']) {
	const gs = GRUPOS.filter(g => grupos.includes(g[0]));
	return `<div class="quadro" style="grid-template-columns:repeat(${gs.length},1fr)">${gs.map(([id, nome, f, cor]) => { const l = js.filter(f); return `<div class="coluna"><div class="coltit" style="border-color:${cor}">${nome} <span class="tag">${l.length}</span></div>${l.slice(0, id === 'publicados' ? 8 : 50).map(j => cartaoVideo(j, comCanal)).join('') || '<div class="small mut" style="padding:10px">nada aqui</div>'}${id === 'publicados' && l.length > 8 ? `<div class="small mut" style="padding:6px">+ ${l.length - 8} mais antigos</div>` : ''}</div>`; }).join('')}</div>`;

// ══════════ Início ══════════

		<div class="card kpi clic" onclick="telaConectar(true)"><div class="ic" style="background:${E.agente.online ? 'var(--ok-l)' : 'var(--err-l)'}">💻</div><div><div class="small mut">Computador</div><b style="color:${E.agente.online ? 'var(--ok)' : 'var(--err)'}">${E.agente.online ? (E.agente.ocupado ? 'Trabalhando' : 'Conectado') : 'Desconectado'}</b></div></div>

	${prec.length ? `<div class="card" style="margin-top:20px;border:2px solid #f8dcae"><h3>✋ Precisa de você</h3><div class="grid g2">${prec.map(j => cartaoVideo(j, true)).join('')}</div></div>` : ''}

}
const vazioCanais = () => `<div class="card empty" style="grid-column:1/-1"><div style="font-size:3rem">📺</div><h2>Crie seu primeiro canal</h2><p>Diga do que ele fala e escolha a voz. Depois é só ligar o piloto automático.</p><button class="btn pri xl" onclick="novoCanal()">+ Criar canal</button></div>`;
function numerosCanal(c, pid) {
	const cj = E.jobs.filter(j => j.canalId === c.id && (!pid || j.pilotoId === pid));
	return { fila: E.temas.filter(t => t.canalId === c.id && (!pid || t.pilotoId === pid)).length, fazendo: cj.filter(GRUPOS[1][2]).length, prontos: cj.filter(GRUPOS[2][2]).length, voce: cj.filter(precisa).length, publicados: cj.filter(GRUPOS[3][2]).length,

}
const pilotosLigados = c => (c.pilotos || []).filter(p => p.ativo).length;

// ══════════ Canais ══════════

	<div class="card" style="margin-top:18px"><div class="row"><div class="sp"><h3 style="margin:0">🧪 Vídeo único (testes)</h3><div class="small mut">Fora do piloto: pesquise temas, escolha o estilo de cada um e gere só o que quiser testar.${filaDe(c.id, 'avulso').length ? ` · ${filaDe(c.id, 'avulso').length} tema(s) esperando` : ''}</div></div><button class="btn pri" onclick="videoUnico('${c.id}')">🧪 Vídeo único</button></div></div>

function cartaoPiloto(c, p) {

async function ligarPiloto(cid, pid, on) {

}
async function pesquisar(cid, pid) { await api(`/canais/${cid}/pilotos/${pid}/pesquisar`, 'POST'); toast('Pesquisa na fila — o computador vai fazer agora'); atualizar(); }

async function salvarPiloto(cid, pid) {
	const est = lerEstilos('pp'); if (!est.length) return toast('Marque pelo menos um estilo');
	const dias = $$('.pp_d:checked').map(x => +x.value); if (!dias.length) return toast('Escolha pelo menos um dia');
	const b = { nome: $('#pp_nome').value.trim() || 'Piloto', formato: $$('[name=pp_fmt]:checked')[0].value, fonte: $$('[name=pp_fonte]:checked')[0].value, palavraChave: $('#pp_chave').value.trim(),
		publicar: $('#pp_pub').checked, dias, horarios: $$('.pp_h').map(x => x.value).filter(Boolean), estilos: est, estoqueAlvo: +$('#pp_est').value, limite: +$('#pp_lim').value, privacidade: $('#pp_priv').value, ativo: $('#pp_at').checked };
	const p = await api(pid ? `/canais/${cid}/pilotos/${pid}` : `/canais/${cid}/pilotos`, pid ? 'PATCH' : 'POST', b);
	fechar(true); await atualizar(); toast(pid ? 'Piloto salvo' : 'Piloto criado 🤖');
	if (!pid && b.fonte === 'manual') temasPiloto(cid, p.id);
}
async function apagarPiloto(cid, pid) { if (!confirm('Apagar este piloto e a fila de temas dele? (vídeos já feitos continuam)')) return; await api(`/canais/${cid}/pilotos/${pid}`, 'DELETE'); fechar(); atualizar(); }

// Temas de um piloto: fila (editável), já usados e pesquisas
const filaDe = (cid, pid) => E.temas.filter(t => t.canalId === cid && t.pilotoId === pid);
async function gravarFila(cid, pid, l) { await api('/temas', 'PUT', { canalId: cid, pilotoId: pid, temas: l }); await atualizar(); temasPiloto(cid, pid, 'fila'); }
async function temasPiloto(cid, pid, aba = 'fila') {
	const c = canalDe(cid), p = c.pilotos.find(x => x.id === pid); if (!p) return;
	editando = true;
	let h = { usados: [], pesquisas: [] };
	if (aba !== 'fila') h = await api(`/historico?canal=${encodeURIComponent(cid)}&piloto=${encodeURIComponent(pid)}`);
	const fila = filaDe(cid, pid), st = E.stats[cid + '|' + pid] || {}, pesq = E.pesquisas.find(q => q.canalId === cid && q.pilotoId === pid && ['pendente', 'rodando'].includes(q.estado));
	modal(`<div class="row"><h2 class="sp" style="margin:0">📝 Temas — ${esc(p.nome)}</h2><button class="btn" onclick="fechar()">✕</button></div>
	${evolucao(st)}
	<div class="tabs">${[['fila', `Na fila (${fila.length})`], ['usados', `Já usados (${st.temasUsados || 0})`], ['pesquisas', `Pesquisas (${st.pesquisas || 0})`]].map(([k, nm]) => `<button class="${aba === k ? 'on' : ''}" onclick="temasPiloto('${cid}','${pid}','${k}')">${nm}</button>`).join('')}</div>
	${aba === 'fila' ? `<div class="row" style="flex-wrap:nowrap"><input type="text" id="novoTema" placeholder="Escreva um tema e aperte Enter" onkeydown="if(event.key==='Enter')addTema('${cid}','${pid}')"><button class="btn pri" onclick="addTema('${cid}','${pid}')">Adicionar</button></div>
		<div class="fila">${fila.map((t, i) => `<div class="tema"><span class="ordem">${i + 1}</span><div class="sp"><b>${esc(t.tema)}</b>${t.detalhe ? `<div class="small mut">${esc(t.detalhe.slice(0, 180))}${t.detalhe.length > 180 ? '…' : ''}</div>` : ''}</div>
			<span title="${t.origem === 'pesquisa' ? 'veio da pesquisa' : 'escrito por você'}">${t.origem === 'pesquisa' ? '🔎' : '✍️'}</span>
			<button class="btn sm" ${i ? '' : 'disabled'} onclick="moverTema('${cid}','${pid}',${i},-1)">↑</button><button class="btn sm" ${i < fila.length - 1 ? '' : 'disabled'} onclick="moverTema('${cid}','${pid}',${i},1)">↓</button><button class="btn sm dan" onclick="tirarTema('${cid}','${pid}',${i})">✕</button></div>`).join('') || '<div class="empty">Fila vazia.</div>'}</div>
		<div class="row" style="margin-top:12px">${p.fonte === 'pesquisa' ? `<button class="btn" ${pesq ? 'disabled' : ''} onclick="pesquisar('${cid}','${pid}').then(()=>temasPiloto('${cid}','${pid}'))">🔎 ${pesq ? 'Pesquisando…' : 'Pesquisar 10 temas agora'}</button>` : ''}<span class="sp"></span><span class="small mut">Os temas são usados de cima para baixo.</span></div>
		${pesq?.log?.length ? `<details style="margin-top:8px"><summary class="small mut">acompanhar pesquisa</summary><pre class="log">${esc(pesq.log.slice(-20).join('\n'))}</pre></details>` : ''}` : ''}
	${aba === 'usados' ? `<div class="fila">${h.usados.map(t => `<div class="tema"><span>${t.origem === 'pesquisa' ? '🔎' : '✍️'}</span><div class="sp"><b>${esc(t.tema)}</b><div class="small mut">usado em ${t.usadoEm ? new Date(t.usadoEm).toLocaleDateString('pt-BR') : '—'}</div></div>${t.jobId && E.jobs.some(j => j.id === t.jobId) ? `<button class="btn sm" onclick="abrirJob('${t.jobId}')">Ver vídeo</button>` : ''}</div>`).join('') || '<div class="empty">Nenhum tema usado ainda.</div>'}</div>` : ''}
	${aba === 'pesquisas' ? `<div class="fila">${h.pesquisas.map(q => `<div class="tema" style="display:block"><div class="row"><span class="tag ${q.estado === 'feito' ? 'feito' : q.estado === 'erro' ? 'erro' : 'rodando'}">${{ pendente: 'na fila', rodando: 'pesquisando', feito: 'concluída', erro: 'falhou' }[q.estado]}</span><b class="sp">${esc(q.palavraChave || '')}</b><span class="small mut">${new Date(q.criado).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span></div>
		${q.videos?.length ? `<div class="small" style="margin-top:8px"><b>📺 Vídeos analisados:</b>${q.videos.map(v => `<div>• ${v.url ? `<a href="${esc(v.url)}" target="_blank">${esc(v.titulo || v.url)}</a>` : esc(v.titulo)}${v.canal ? ` <span class="mut">— ${esc(v.canal)}</span>` : ''}${v.views ? ` <span class="mut">(${Number(v.views).toLocaleString('pt-BR')} views)</span>` : ''}</div>`).join('')}</div>` : ''}
		${q.temas?.length ? `<div class="small" style="margin-top:8px"><b>💡 Temas criados:</b>${q.temas.map(t => `<div>• ${esc(t)}${h.usados.some(u => u.tema === t) ? ' <span class="tag feito">usado</span>' : ''}</div>`).join('')}</div>` : ''}
		${q.erro ? `<div class="small" style="color:var(--err);margin-top:6px">${esc(q.erro.slice(0, 200))}</div>` : ''}</div>`).join('') || '<div class="empty">Nenhuma pesquisa ainda.</div>'}</div>` : ''}`);
	if (aba === 'fila') setTimeout(() => $('#novoTema')?.focus(), 50);
}
async function addTema(cid, pid) { const v = $('#novoTema').value.trim(); if (!v) return; await gravarFila(cid, pid, [...filaDe(cid, pid), { tema: v, origem: 'manual' }]); toast('Tema adicionado'); }
async function tirarTema(cid, pid, i) { const l = filaDe(cid, pid); l.splice(i, 1); await gravarFila(cid, pid, l); }
async function moverTema(cid, pid, i, d) { const l = filaDe(cid, pid); [l[i], l[i + d]] = [l[i + d], l[i]]; await gravarFila(cid, pid, l); }

async function salvarFicha(id, aba) {

async function apagarCanal(id) { if (!confirm('Apagar este canal, a fila de temas e as configurações dele?')) return; await api('/canais/' + id, 'DELETE'); fechar(); ir('canais'); }

async function criarLote(cid) {
	const est = lerEstilos('nl'); if (!est.length) return toast('Marque pelo menos um estilo');

	fechar(); toast(r.ids.length + ' vídeo(s) na fila'); atualizar();

// ══════════ Vídeo único (testes, fora do piloto) ══════════
const vuForm = {};
const vuRascunho = cid => vuForm[cid] ||= { chave: canalDe(cid).pesquisaTema || canalDe(cid).nicho || '', formato: canalDe(cid).formato || 'short', instrucoes: '', estilos: {}, ...(canalDe(cid).rascunhoUnico || {}) };
let vuT = 0;
function vuSalvar(cid, ja) { clearTimeout(vuT); const f = () => api('/canais/' + cid, 'PATCH', { rascunhoUnico: vuForm[cid] }).catch(() => {}); return ja ? f() : (vuT = setTimeout(f, 600)); }
function vuEst(cid, tema, v) { vuRascunho(cid).estilos[tema] = v; vuSalvar(cid); }
// rascunhos com pesquisa rodando ou temas esperando (aparecem no Início)
const vuPendentes = () => E.canais.map(c => ({ c, n: filaDe(c.id, 'avulso').length, pesq: E.pesquisas.find(q => q.canalId === c.id && q.pilotoId === 'avulso' && ['pendente', 'rodando'].includes(q.estado)) })).filter(x => x.n || x.pesq);
function videoUnico(cid) {
	const c = canalDe(cid), temas = filaDe(cid, 'avulso'), f = vuRascunho(cid);
	const pesq = E.pesquisas.find(q => q.canalId === cid && q.pilotoId === 'avulso' && ['pendente', 'rodando'].includes(q.estado));
	const ests = E.estilos.filter(e => e.ativo), doCanal = (c.estilos || []).filter(id => ests.some(e => e.id === id));
	const selEst = i => `<select class="vu_est" data-i="${i}" style="width:auto;max-width:200px" onchange="vuEst('${cid}',${esc(JSON.stringify(temas[i].tema))},this.value)">${opcoes(ests.map(e => [e.id, e.nome]), ests.some(e => e.id === f.estilos[temas[i].tema]) ? f.estilos[temas[i].tema] : doCanal.length ? doCanal[i % doCanal.length] : ests[0]?.id)}</select>`;
	modal(`<div class="row"><h2 class="sp" style="margin:0">🧪 Vídeo único — ${esc(c.nome)}</h2><button class="btn" onclick="fechar()">✕</button></div>
	<p class="small mut">Para testar estilos antes de ligar o piloto: nada aqui entra na agenda nem na fila dos pilotos. Cada tema vira 1 vídeo com o estilo que você escolher, 100% automático (voz sintética, sem pedir aprovação). 💾 Fica salvo como rascunho: pode fechar e voltar depois (a pesquisa continua no computador).</p>
	<div class="row" style="gap:8px;align-items:end"><div class="sp"><label class="f">Palavra-chave da pesquisa</label><input type="text" id="vu_chave" value="${esc(f.chave)}" oninput="vuForm['${cid}'].chave=this.value;vuSalvar('${cid}')"></div>
		<div><label class="f">Formato</label><select id="vu_fmt" style="width:auto" onchange="vuForm['${cid}'].formato=this.value;vuSalvar('${cid}')">${opcoes([['short', 'Short 9:16'], ['longo', 'Longo 16:9']], f.formato)}</select></div>
		<button class="btn" ${pesq ? 'disabled' : ''} onclick="vuPesquisar('${cid}')">🔎 ${pesq ? 'Pesquisando…' : 'Pesquisar 10 temas'}</button></div>
	${pesq?.log?.length ? `<details style="margin-top:8px"><summary class="small mut">acompanhar pesquisa</summary><pre class="log">${esc(pesq.log.slice(-20).join('\n'))}</pre></details>` : ''}
	<label class="f" style="margin-top:14px">Temas (${temas.length})</label>
	<div class="fila">${temas.map((t, i) => `<div class="tema"><span title="${t.origem === 'pesquisa' ? 'veio da pesquisa' : 'escrito por você'}">${t.origem === 'pesquisa' ? '🔎' : '✍️'}</span><div class="sp"><b>${esc(t.tema)}</b>${t.detalhe ? `<div class="small mut">${esc(t.detalhe.slice(0, 160))}</div>` : ''}</div>
		${selEst(i)}<button class="btn pri sm" onclick="vuGerar('${cid}',${i})">🎬 Gerar</button><button class="btn sm" title="Tirar" onclick="vuTirar('${cid}',${i})">✕</button></div>`).join('') || `<div class="empty">${pesq ? 'A pesquisa está rodando no computador; os temas aparecem aqui.' : 'Nenhum tema ainda: pesquise ou escreva um abaixo.'}</div>`}</div>
	<div class="row" style="margin-top:10px;gap:8px"><input type="text" id="vu_novo" class="sp" placeholder="Escrever um tema meu…" onkeydown="if(event.key==='Enter')vuAdd('${cid}')"><button class="btn" onclick="vuAdd('${cid}')">+ Tema</button></div>
	<label class="f">Pedido extra para os vídeos gerados (opcional)</label><input type="text" id="vu_i" placeholder="ex.: tom mais leve" value="${esc(f.instrucoes || '')}" oninput="vuForm['${cid}'].instrucoes=this.value;vuSalvar('${cid}')">
	<div class="row" style="margin-top:18px"><span class="small mut sp">O vídeo aparece em 🎬 Vídeos (etapas e aprovações normais).</span>${temas.length > 1 ? `<button class="btn" onclick="vuGerar('${cid}',-1)">Gerar todos</button>` : ''}<button class="btn" onclick="fechar()">Fechar</button></div>`);
}
async function vuSalvarTemas(cid, temas) { await api('/temas', 'PUT', { canalId: cid, pilotoId: 'avulso', temas: temas.map(t => ({ tema: t.tema })) }); await atualizar(); videoUnico(cid); }
async function vuAdd(cid) { const v = $('#vu_novo').value.trim(); if (v) await vuSalvarTemas(cid, [...filaDe(cid, 'avulso'), { tema: v }]); }
async function vuTirar(cid, i) { await vuSalvarTemas(cid, filaDe(cid, 'avulso').filter((_, k) => k !== i)); }
async function vuPesquisar(cid) {
	await vuSalvar(cid, true);
	const r = await api(`/canais/${cid}/avulso/pesquisar`, 'POST', { palavraChave: $('#vu_chave').value.trim(), formato: $('#vu_fmt').value });
	if (r?.erro) return toast(r.erro); toast('Pesquisa na fila — o computador vai fazer agora'); await atualizar(); videoUnico(cid);
}
async function vuGerar(cid, i) {

function nomeArq(p) {

const mdInline = s => esc(s).replace(/`?(?:roteiros|demos|audio|renders)\/[\w./-]+`?/g, p => nomeArq(p.replace(/`/g, ''))).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/&lt;br\s*\/?&gt;/g, '<br>');
function md(txt) {
	const L = String(txt).replace(/\r/g, '').split('\n'), o = []; let lista = false;
	const fecha = () => { if (lista) { o.push('</ul>'); lista = false; } };
	const cel = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
	const sep = r => /^\s*\|[\s:|-]+\|?\s*$/.test(r);

		const l = L[i]; let m;

			fecha(); const ls = []; while (i < L.length && /^\s*\|/.test(L[i])) ls.push(L[i++]); i--;

			o.push('<table>' + ls.filter(r => !sep(r)).map((r, k) => '<tr>' + cel(r).map(c => k === 0 && temCab ? `<th>${mdInline(c)}</th>` : `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</table>');

		}
		if ((m = l.match(/^(#{1,6})\s+(.*)/))) { fecha(); const n = Math.min(m[1].length, 3); o.push(`<h${n}>${mdInline(m[2])}</h${n}>`); continue; }
		if ((m = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/))) { if (!lista) { o.push('<ul>'); lista = true; } o.push(`<li>${mdInline(m[1])}</li>`); continue; }
		if ((m = l.match(/^>\s?(.*)/))) { fecha(); o.push(`<blockquote>${mdInline(m[1])}</blockquote>`); continue; }

		if (l.trim()) o.push(`<p>${mdInline(l)}</p>`);

}

// ══════════ Teste A/B de thumbnails ══════════
let TT = null, ttCarregado = 0;
async function thumbs() {
	if (!TT || Date.now() - ttCarregado > 60000) { TT = await api('/testes'); ttCarregado = Date.now(); }
	const img = (job, n) => `<img src="${API}/testes/thumb?job=${job}&n=${n}" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:var(--p2)">`;
	const num = (v, suf = '') => v == null ? '—' : (typeof v === 'number' ? v.toLocaleString('pt-BR') : v) + suf;
	const mmss = s => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '—';
	const dataBR = d => d.split('-').reverse().slice(0, 2).join('/');
	const card = t => {
		const c = canalDe(t.canalId), validas = (t.notas || []).filter(x => x != null), best = validas.length ? Math.max(...validas) : null;
		const st = t.estado === 'concluido' ? 'concluido' : t.estado === 'cancelado' ? 'cancelado' : t.erro ? 'erro' : 'rodando';
		const apurando = t.estado === 'ativo' && TT.hoje > t.fases[t.fases.length - 1].fim && t.atual + 1 >= t.thumbs;
		const rot = t.estado === 'concluido' ? `vencedora: thumb ${t.vencedora + 1}` : t.estado === 'cancelado' ? 'cancelado' : apurando ? `apurando (o YouTube atrasa ${TT.atraso} dias)` : `semana ${t.atual + 1} de ${t.thumbs}`;
		const cols = Array.from({ length: t.thumbs }, (_, k) => {
			const f = t.fases[k], m = f && f.m, nota = (t.notas || [])[k], no = t.estado === 'ativo' && k === t.atual && !apurando, venc = t.vencedora === k;
			const linhas = m ? [['Nota', nota == null ? (m.views < 20 ? 'poucos dados' : '—') : `<b>${nota}</b>${nota === best ? ' ⭐' : ''}`], ['CTR', num(m.ctr, '%')], ['Impressões', num(m.impressoes)], ['Visualizações', num(m.views)],
				['% assistido (média)', num(m.pctMedio, '%')], ['Duração média', mmss(m.duracaoMedia)], ['Ficam após 10%', num(m.ret10, '%')], ['Ficam após 30%', num(m.ret30, '%')], ['Ficam na metade', num(m.ret50, '%')], ['Inscritos ganhos', num(m.inscritos)]] : [];
			return `<div style="border:2px solid ${venc ? 'var(--ok)' : no ? 'var(--ac)' : 'var(--p3)'};border-radius:14px;padding:10px">${img(t.jobId, k + 1)}
			<div class="row" style="margin:8px 0 4px"><b class="sp">Thumb ${k + 1}</b>${venc ? '<span class="tag feito">🏆 vencedora</span>' : no ? '<span class="tag rodando">no ar</span>' : ''}</div>
			<div class="small mut">${f ? `${dataBR(f.inicio)} → ${dataBR(f.fim)}` : 'ainda não foi ao ar'}</div>
			${m ? `<table class="small" style="width:100%;margin-top:6px">${linhas.map(([a, b]) => `<tr><td class="mut">${a}</td><td style="text-align:right">${b}</td></tr>`).join('')}</table><div class="small mut">dados até ${dataBR(m.ate)}</div>` : ''}
			${t.estado === 'ativo' ? `<button class="btn sm" style="margin-top:8px" onclick="acaoTeste('${t.id}','escolher',${k})">Ficar com esta</button>` : ''}</div>`;
		}).join('');
		const botoes = t.estado === 'ativo' ? `${!apurando ? `<button class="btn sm" onclick="acaoTeste('${t.id}','avancar')">Encerrar esta semana agora</button>` : ''}<button class="btn sm" onclick="acaoTeste('${t.id}','atualizar')">Atualizar métricas</button><span class="sp"></span><button class="btn sm dan" onclick="acaoTeste('${t.id}','cancelar')">Cancelar teste</button>`
			: t.estado === 'cancelado' ? `<button class="btn sm" onclick="acaoTeste('${t.id}','retomar')">Retomar</button>` : '';
		return `<div class="card" style="margin-bottom:18px"><div class="row" style="margin-bottom:10px"><span style="width:12px;height:12px;border-radius:50%;background:${c.cor}"></span><b class="sp" style="font-size:1.1rem">${esc(t.titulo)}</b><span class="tag ${st}">${esc(rot)}</span></div>
		<div class="small mut" style="margin-bottom:10px">${esc(c.nome)} · <a href="https://youtu.be/${t.videoId}" target="_blank">abrir no YouTube</a>${t.coleta ? ` · métricas de ${dataBR(t.coleta)}` : ''}</div>
		${t.erro ? `<div class="hint">⚠️ ${esc(t.erro)}</div>` : ''}${t.erroColeta ? `<div class="hint">📊 Estatísticas: ${esc(t.erroColeta)}</div>` : ''}
		<div class="grid g3" style="margin-top:10px">${cols}</div>
		<div class="row" style="margin-top:12px">${botoes}</div>
		<details class="small mut" style="margin-top:8px"><summary>Histórico</summary>${(t.log || []).slice().reverse().map(l => `<div>${new Date(l.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })} — ${esc(l.txt)}</div>`).join('')}</details></div>`;
	};
	const ativos = TT.testes.filter(t => t.estado === 'ativo'), outros = TT.testes.filter(t => t.estado !== 'ativo');
	const espera = TT.espera.map(e => `<div class="row" style="margin:8px 0"><div style="width:260px;gap:4px" class="row">${[1, 2, 3].slice(0, e.thumbs).map(n => `<div style="flex:1">${img(e.jobId, n)}</div>`).join('')}</div><b class="sp">${esc(e.titulo)}</b>
		${e.url ? `<button class="btn sm pri" onclick="api('/testes/criar','POST',{jobId:'${e.jobId}'}).then(()=>{TT=null;thumbs()})">Começar teste</button>` : '<span class="small mut">começa sozinho ao publicar</span>'}<button class="btn sm" onclick="abrirJob('${e.jobId}')">Ver vídeo</button></div>`).join('');
	$('#app').innerHTML = `<div class="row" style="margin-bottom:6px"><div class="titulo sp">Teste A/B de thumbnails</div><button class="btn" onclick="TT=null;thumbs()">↻ Recarregar</button></div>
	<p class="sub">Todo vídeo longo sai com 3 thumbnails. Cada uma fica ${TT.dias} dias no ar; no fim, fica a de melhor <b>nota</b>: CTR 35% · % assistido 35% · quem fica após 30% do vídeo 20% · inscritos por mil views 10%. Views não contam (a 1ª semana sempre tem mais, por causa do lançamento). Sem CTR disponível, a nota usa só retenção e inscritos.</p>
	${espera ? `<div class="card" style="margin-bottom:18px"><h3>Esperando publicação</h3>${espera}</div>` : ''}
	${ativos.map(card).join('') || (espera ? '' : '<div class="empty">Nenhum teste ainda. Ele começa sozinho quando um vídeo longo com thumbnails for publicado.</div>')}
	${outros.length ? `<h3 style="margin:26px 0 12px">Encerrados</h3>${outros.map(card).join('')}` : ''}`;
}
async function acaoTeste(id, acao, n) {
	if (acao === 'cancelar' && !confirm('Cancelar o teste? A thumbnail atual fica no ar.')) return;
	if (acao === 'escolher' && !confirm(`Encerrar o teste e deixar a thumbnail ${n + 1} definitiva?`)) return;
	await api('/testes/acao', 'POST', { id, acao, n }); toast('Feito'); TT = null; thumbs();
}

	${aba === 'dossie' ? (d.dossie ? `<p class="small mut">Dossiê do pesquisador: para cada vídeo, a promessa, o gancho, a estrutura, o final e o resumo dos 10 comentários mais curtidos (o que o público sentiu e perguntou).</p><div class="doc">${md(d.dossie)}</div>` : '<div class="empty">O dossiê ainda não chegou. Ele é enviado pelo computador conectado assim que a pesquisa termina (pesquisas antigas: deixe o computador conectado por alguns segundos).</div>') : ''}

		${E.usuario.admin ? `<h3 style="margin-top:20px">Painel (todos)</h3>
		<div class="grid g2"><div><label class="f">Endereço público</label><input type="text" id="g_url" value="${esc(c.urlPublica)}"></div><div><label class="f">Fuso horário</label><input type="text" id="g_fuso" value="${esc(c.fuso)}"></div></div>
		<div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn pri" onclick="salvarGlobal()">Salvar</button></div>
		<h3 style="margin-top:20px">Instruções de cada etapa</h3>
		<select id="c_psel" onchange="promptSel=this.value;ajustes()">${opcoes(Object.keys(c.promptsPadrao).map(k => [k, k + (c.prompts[k] ? ' (editado)' : '')]), promptSel)}</select>
		<textarea class="code" id="c_prompt" style="min-height:240px;margin-top:8px">${esc(c.prompts[promptSel] || c.promptsPadrao[promptSel])}</textarea>
		<div class="row" style="margin-top:8px"><button class="btn sm" onclick="salvarPrompt(true)">Voltar ao padrão</button><span class="sp"></span><button class="btn pri" onclick="salvarPrompt()">Salvar instrução</button></div>` : ''}
	</details></div></div>`;
}
async function salvarConta() {
	const b = { nome: $('#c_nome').value, avisos: { telegramToken: $('#c_tgt').value.trim(), telegramChat: $('#c_tgc').value.trim(), webhook: $('#c_wh').value.trim() } };
	if ($('#c_mod')) b.prefs = { modeloFixo: $('#c_mod').value.trim(), esforcoFixo: $('#c_esf').value, ferramentas: $('#c_tools').value.trim() };
	Object.assign(CFG, await api('/eu', 'PATCH', b)); toast('Salvo');
}
async function trocarSenha() { await api('/eu', 'PATCH', { senhaAtual: $('#c_sa').value, novaSenha: $('#c_sn').value }); toast('Senha trocada'); $('#c_sa').value = $('#c_sn').value = ''; }
async function salvarClienteGoogle() { if (!$('#g_gid').value.trim() || !$('#g_gs').value.trim()) return toast('Cole o Client ID e o Client secret'); await api('/global', 'PATCH', { google: { clientId: $('#g_gid').value, clientSecret: $('#g_gs').value } }); CFG = await api('/eu'); toast('Salvo para todos'); ajustes(); }
async function salvarGlobal() { await api('/global', 'PATCH', { urlPublica: $('#g_url').value.trim().replace(/\/$/, ''), fuso: $('#g_fuso').value.trim() }); CFG = await api('/eu'); toast('Salvo'); }
async function salvarPrompt(padrao) { const p = { ...CFG.prompts }; if (padrao) delete p[promptSel]; else p[promptSel] = $('#c_prompt').value; await api('/global', 'PATCH', { prompts: p }); CFG.prompts = p; toast('Instrução salva'); ajustes(); }

// ══════════ Usuários (admin) ══════════
async function usuarios() {
	editando = true; const us = await api('/usuarios');
	$('#app').innerHTML = `<div class="titulo" style="margin-bottom:18px">Usuários</div>
	<div class="grid g2"><div class="card"><h3>Pessoas com acesso</h3><div class="list">${us.map(x => `<div class="it" style="cursor:default"><span class="dot ${x.agente ? 'on' : ''}"></span><div class="sp"><b>${esc(x.nome)}</b><div class="small mut">${esc(x.login)}${x.admin ? ' · administrador' : ''} · ${x.canais} canais</div></div>
		<button class="btn sm" onclick="novaSenhaDe('${x.id}')">Nova senha</button>${x.id !== E.usuario.id ? `<button class="btn sm dan" onclick="if(confirm('Remover ${esc(x.login)}?'))api('/usuarios/${x.id}','DELETE').then(usuarios)">Remover</button>` : ''}</div>`).join('')}</div></div>
	<div class="card"><h3>Adicionar pessoa</h3>
		<div class="grid g2"><div><label class="f">Nome</label><input type="text" id="nu_nome"></div><div><label class="f">Login</label><input type="text" id="nu_login"></div></div>
		<label class="f">Senha inicial (ela troca depois)</label><input type="text" id="nu_senha" value="${Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8)}">
		<label class="row small" style="margin-top:10px"><input type="checkbox" id="nu_adm"> Administrador</label>
		<div class="info">Cada pessoa vê só os próprios canais e conecta o próprio computador. Os estilos são compartilhados.</div>
		<div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn pri" onclick="criarUsuario()">Criar</button></div></div></div>`;
}
async function criarUsuario() { const b = { nome: $('#nu_nome').value, login: $('#nu_login').value, senha: $('#nu_senha').value, admin: $('#nu_adm').checked }; await api('/usuarios', 'POST', b); toast(`Criado: ${b.login} / ${b.senha}`); usuarios(); }
async function novaSenhaDe(id) { const s = prompt('Nova senha (mín. 8):'); if (s) { await api('/usuarios/' + id, 'PATCH', { senha: s }); toast('Senha alterada'); } }

// ══════════ Avisos ══════════
async function verAvisos() {
	modal(`<div class="row"><h2 class="sp" style="margin:0">🔔 Avisos</h2><button class="btn" onclick="fechar()">✕</button></div>
	<div class="list" style="margin-top:12px">${E.avisos.map(a => `<div class="it" style="cursor:${a.jobId ? 'pointer' : 'default'}" ${a.jobId ? `onclick="abrirJob('${a.jobId}')"` : ''}><span>${{ erro: '🔴', aviso: '🟡', info: '🔵' }[a.tipo] || '🔵'}</span><div class="sp"${a.lido ? ' style="opacity:.6"' : ''}>${esc(a.texto)}<div class="small mut">${new Date(a.em).toLocaleString('pt-BR')}</div></div></div>`).join('') || '<div class="empty">Nenhum aviso.</div>'}</div>`);
	if (E.naoLidos) { await api('/avisos/lidos', 'POST'); E.naoLidos = 0; $('#nl').textContent = ''; }
}

// ══════════ Conectar o computador (obrigatório para produzir) ══════════
function telaConectar(manual) {
	conectando = true; fechar(true); editando = true; $('#banner').style.display = 'none';
	const jaConectou = (E.agente.visto || 0) > 0, url = CFG.urlPublica || location.origin + location.pathname.replace(/\/$/, '');
	$('#app').innerHTML = `<div class="onb"><div class="card">
		<div class="titulo">${E.agente.online ? '✅ Computador conectado' : jaConectou ? '🔌 Reconecte seu computador' : '👋 Vamos conectar seu computador'}</div>
		<p class="sub">Os vídeos são feitos <b>no seu computador</b>, pelo Claude. ${jaConectou ? 'Se ele estiver ligado, rode o conector de novo.' : 'Isto é feito <b>uma vez só</b>: depois ele liga sozinho sempre que o computador ligar.'}</p>
		<div class="passo"><div class="num">1</div><div><h3>Baixe o conector</h3>
			<p class="mut">Um arquivo pequeno, já com o seu código de acesso.</p>
			<a class="btn pri xl" href="${API}/conector" download>⬇ Baixar conector do Estúdio</a>
			<p class="small mut" style="margin-top:10px">Para Windows. Mac: veja "Fazer à mão" lá embaixo.</p></div></div>
		<div class="passo"><div class="num">2</div><div><h3>Dê dois cliques no arquivo baixado</h3>
			<p>Ele se chama <b>Conectar-Estudio.cmd</b> e fica na pasta <b>Downloads</b>.</p>
			<div class="hint">Se aparecer <b>"O Windows protegeu o computador"</b>: clique em <b>Mais informações</b> e depois em <b>Executar assim mesmo</b>.</div>
			<p class="small mut" style="margin-top:10px">Na primeira vez ele pede uma pasta (pode ser qualquer uma) e baixa tudo o que precisa nela. Depois lembra a pasta.</p></div></div>
		<div class="passo"><div class="num">3</div><div><h3>Espere a confirmação aqui</h3>
			<div class="espera" id="espera">${E.agente.online ? '✅ Conectado: ' + esc(E.agente.nome || '') : '<div class="roda"></div>Procurando seu computador…'}</div>
			<p class="small mut">Esta tela continua sozinha assim que o computador conectar.</p></div></div>
		<details style="margin-top:8px"><summary class="small mut" style="cursor:pointer">Fazer à mão (Mac, Linux)</summary>
			<p class="small">Com a pasta do projeto, o Node.js e o Claude Code instalados, abra o terminal na pasta do projeto e cole:</p>
			<pre class="log" id="cmdman">${esc(`node painel/agente.cjs --painel ${url} --token ${CFG.tokenAgente}`)}</pre>
			<button class="btn sm" onclick="navigator.clipboard.writeText($('#cmdman').textContent);toast('Copiado')">Copiar comando</button></details>
		<div class="row" style="margin-top:22px"><span class="sp"></span>${E.agente.online ? '<button class="btn pri" onclick="sairConexao()">Voltar ao painel</button>' : jaConectou || manual ? '<button class="btn" onclick="pularConexao()">Ver o painel sem o computador</button>' : ''}<button class="btn dan" onclick="sair()">Sair</button></div>
	</div></div>`;
	if (E.agente.online && !manual) conectado();
}
function conectado() {
	$('#app').innerHTML = `<div class="onb"><div class="card sucesso"><div class="ic">✅</div><div class="titulo">Computador conectado!</div>
		<p class="sub">${esc(E.agente.nome || 'Seu computador')} está pronto para fazer os vídeos.</p><button class="btn pri xl" onclick="sairConexao()">Continuar →</button></div></div>`;
	setTimeout(() => { if ($('.sucesso')) sairConexao(); }, 2500);
}
function sairConexao() { conectando = false; ir('inicio'); }
function pularConexao() { verSemPC = true; sessionStorage.verSemPC = '1'; sairConexao(); }

// ══════════ Rotas na URL (#/videos, #/canal/ID, #/video/ID/aba) ══════════
function rota() {
	const h = '#/' + (jobAberto ? `video/${jobAberto}${abaJob !== 'etapas' ? '/' + abaJob : ''}` : view === 'canal' ? 'canal/' + canalAberto : view);
	if (location.hash !== h) history.replaceState(null, '', h);
}
function seguirRota(h) {
	const [v, id, aba] = h.replace(/^#\/?/, '').split('/');
	if (v === 'video' && id) { if (jobAberto !== id) { abaJob = aba || 'etapas'; jobAberto = id; abrirJob(id).catch(() => ir('videos')); } return true; }
	if (v === 'canal' && id) { ir('canal', id); return true; }
	if (['inicio', 'canais', 'videos', 'thumbs', 'pesquisas', 'estilos', 'ajustes', 'usuarios'].includes(v)) { ir(v); return true; }
	return false;
}
addEventListener('hashchange', () => seguirRota(location.hash));
// ══════════ Início do app ══════════
async function iniciar() {
	try { CFG = await api('/eu'); await atualizar(); } catch { return; }
	$('#nav-usuarios').style.display = E.usuario.admin ? '' : 'none';
	const h = location.hash;
	if (h && !h.startsWith('#/')) { toast({ '#youtube-ok': 'YouTube conectado ✔', '#erro-youtube': 'Falha ao conectar o YouTube (veja os avisos 🔔)', '#youtube-cancelado': 'Conexão com o YouTube cancelada', '#youtube-sem-cliente': 'O administrador ainda não configurou o YouTube em Ajustes' }[h]); history.replaceState(null, '', location.pathname); }
	if (!E.agente.online && !verSemPC && !h.includes('youtube')) telaConectar();
	else if (h.includes('youtube') && E.canais.length === 1) ir('canal', E.canais[0].id);
	else if (!(h.startsWith('#/') && seguirRota(h))) rota();
	clearInterval(window._poll); window._poll = setInterval(() => atualizar().catch(() => { }), 3000);
}
iniciar();
</script>
